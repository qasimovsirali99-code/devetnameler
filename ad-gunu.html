<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#211a3d">
<title>Ad Günü Dəvətnaməsi</title>
<meta property="og:title" content="Ad Günü Dəvətnaməsi">
<meta property="og:description" content="Ad günü şənliyimə dəvətlisiniz">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600&family=Jost:wght@300;400;500&display=swap&subset=latin-ext" rel="stylesheet">
<style>
  :root{
    --night:#211a3d; --night2:#150f2b; --plum:#382c5e;
    --pink:#ff6f9c; --yellow:#ffd25e; --mint:#5fe0c0; --sky:#63b8ff; --coral:#ff8a5b;
    --cream:#fff6ee;
    --display:"Fredoka","Segoe UI",sans-serif;
    --sans:"Jost","Segoe UI",sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overflow-x:hidden}
  body{
    font-family:var(--sans);font-weight:300;
    background:radial-gradient(ellipse at 50% 10%,#3b2d68 0%,#211a3d 48%,#140e28 100%);
    background-attachment:fixed;
    color:var(--cream);min-height:100vh;min-height:100dvh;
    display:flex;align-items:center;justify-content:center;position:relative;
    -webkit-text-size-adjust:100%;
  }
  body.locked{overflow:hidden;position:fixed;width:100%}

  /* şarlar */
  .balloons{position:fixed;inset:0;z-index:1;pointer-events:none;overflow:hidden}
  .balloon{position:absolute;bottom:-24vh;width:clamp(30px,8vw,52px);
    animation:ascend linear infinite}
  .balloon .in{animation:swing 4.5s ease-in-out infinite;transform-origin:50% 0}
  @keyframes ascend{0%{bottom:-24vh;opacity:0}10%{opacity:1}88%{opacity:1}100%{bottom:114vh;opacity:0}}
  @keyframes swing{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(6deg)}}

  /* konfetti */
  .confetti{position:fixed;inset:0;z-index:2;pointer-events:none;overflow:hidden}
  .conf{position:absolute;top:-30px;opacity:0;border-radius:1px;
    animation:drop linear infinite;will-change:transform}
  @keyframes drop{
    0%{transform:translate3d(0,-30px,0) rotate(0);opacity:0}
    10%{opacity:1}88%{opacity:1}
    100%{transform:translate3d(70px,108vh,0) rotate(720deg);opacity:0}
  }
  /* açılış partlayışı */
  .burst{position:fixed;inset:0;z-index:14;pointer-events:none;overflow:hidden;display:none}
  .burst.on{display:block}
  .bp{position:absolute;top:50%;left:50%;width:9px;height:14px;border-radius:1px;
    animation:blast 1.6s cubic-bezier(.15,.75,.35,1) forwards}
  @keyframes blast{
    0%{transform:translate(-50%,-50%) rotate(0);opacity:1}
    100%{transform:translate(var(--tx),var(--ty)) rotate(680deg);opacity:0}
  }

  /* ===== QAPI: hədiyyə qutusu ===== */
  .gate{position:fixed;inset:0;z-index:20;display:flex;perspective:1500px;cursor:pointer;overflow:hidden;touch-action:manipulation}
  .gate.open{pointer-events:none}
  .gate.gone{display:none}
  .door{position:relative;width:50.2%;height:100%;
    background:
      repeating-linear-gradient(135deg, rgba(255,255,255,.045) 0 12px, transparent 12px 24px),
      linear-gradient(165deg,#4b3a7d,#2a2050 60%,#1b1436);
    transition:transform 2s cubic-bezier(.62,0,.2,1);
    transform-style:preserve-3d;backface-visibility:hidden;will-change:transform;overflow:hidden}
  .door.left{transform-origin:left center}
  .door.right{transform-origin:right center}
  .gate.open .door.left{transform:rotateY(-104deg)}
  .gate.open .door.right{transform:rotateY(104deg)}
  /* lent — şaquli */
  .ribbon-v{position:absolute;top:0;bottom:0;width:clamp(34px,9vw,58px);
    background:linear-gradient(90deg,#ff5f92,var(--pink) 40%,#ff8ab3);
    box-shadow:0 0 26px rgba(255,111,156,.45)}
  .door.left .ribbon-v{right:0}
  .door.right .ribbon-v{left:0}
  /* lent — üfüqi */
  .ribbon-h{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);
    height:clamp(28px,7vw,46px);
    background:linear-gradient(180deg,#ff8ab3,var(--pink) 45%,#ff5f92);
    box-shadow:0 0 26px rgba(255,111,156,.35)}
  /* qutu haşiyəsi */
  .boxline{position:absolute;inset:clamp(14px,3.6vw,24px);
    border:2px dashed rgba(255,210,94,.4);border-radius:8px}

  .gate-center{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
    z-index:4;text-align:center;pointer-events:none;width:92%;transition:opacity .5s ease}
  .gate.open .gate-center{opacity:0}
  /* bant */
  .bow{width:clamp(104px,29vw,140px);height:clamp(104px,29vw,140px);
    margin:0 auto clamp(18px,4.2vw,26px);position:relative;
    display:flex;align-items:center;justify-content:center;
    animation:bounce 2.6s ease-in-out infinite}
  @keyframes bounce{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-9px) scale(1.04)}}
  .bow svg{width:100%;height:100%;filter:drop-shadow(0 8px 20px rgba(0,0,0,.45))}
  .bow span{position:absolute;font-family:var(--display);font-weight:600;
    font-size:clamp(20px,5.6vw,27px);color:#fff;letter-spacing:.5px;
    text-shadow:0 2px 8px rgba(0,0,0,.35);margin-top:clamp(14px,4vw,22px)}
  .tap-hint{font-size:clamp(10px,2.9vw,12px);letter-spacing:5px;text-transform:uppercase;
    color:var(--yellow);font-weight:400}
  .tap-hint small{display:block;margin-top:12px;font-size:clamp(18px,5vw,22px);letter-spacing:0;
    animation:tapper 1.5s ease-in-out infinite}
  @keyframes tapper{0%,100%{transform:translateY(0);opacity:.55}50%{transform:translateY(-9px);opacity:1}}

  /* ===== KART ===== */
  .card{position:relative;z-index:5;width:min(91vw,520px);
    margin:clamp(24px,7vw,48px) auto;
    padding:clamp(40px,10vw,60px) clamp(24px,7vw,42px) clamp(34px,8vw,50px);
    text-align:center;
    background:linear-gradient(168deg,rgba(56,44,94,.92),rgba(21,15,43,.95));
    border:1px solid rgba(255,210,94,.35);border-radius:22px;
    box-shadow:0 28px 80px rgba(0,0,0,.55), inset 0 0 70px rgba(255,111,156,.05);
    overflow:hidden}

  .reveal{opacity:0;transform:translateY(20px) scale(.97)}
  .revealed .reveal{animation:pop .8s cubic-bezier(.2,1.2,.4,1) forwards}
  @keyframes pop{to{opacity:1;transform:translateY(0) scale(1)}}

  .eyebrow{font-size:clamp(10px,2.8vw,12px);letter-spacing:5px;text-transform:uppercase;
    color:var(--mint);animation-delay:.25s;font-weight:400}

  /* tort */
  .cake{width:clamp(58px,15vw,78px);margin:clamp(16px,4vw,24px) auto;animation-delay:.42s}
  .cake .flame{transform-origin:50% 100%;animation:flick .6s ease-in-out infinite alternate}
  @keyframes flick{from{transform:scaleY(1) scaleX(1)}to{transform:scaleY(1.25) scaleX(.85)}}

  .yas{font-family:var(--display);font-weight:600;
    font-size:clamp(58px,19vw,104px);line-height:1;color:var(--yellow);
    margin:clamp(6px,2vw,10px) 0;animation-delay:.6s;
    text-shadow:0 4px 24px rgba(255,210,94,.35)}
  .ad{font-family:var(--display);font-weight:500;
    font-size:clamp(28px,8.5vw,44px);line-height:1.1;color:var(--cream);
    margin:clamp(6px,2vw,12px) 0 0;animation-delay:.78s;overflow-wrap:break-word}
  .sub{font-size:clamp(13px,3.6vw,15px);color:var(--pink);
    margin-top:clamp(12px,3.2vw,18px);animation-delay:.95s;line-height:1.6;font-weight:400}

  .rule{margin:clamp(24px,5.5vw,34px) auto;width:0;height:2px;border-radius:2px;
    background:linear-gradient(90deg,var(--pink),var(--yellow),var(--mint),var(--sky))}
  .revealed .rule{animation:grow 1.1s ease 1.1s forwards}
  @keyframes grow{to{width:78%}}

  .detail{margin:clamp(14px,3.6vw,20px) 0;animation-delay:1.2s}
  .detail .label{font-size:clamp(9px,2.5vw,10px);letter-spacing:4px;text-transform:uppercase;color:var(--mint)}
  .detail .value{font-family:var(--display);font-weight:400;
    font-size:clamp(17px,4.6vw,21px);color:var(--cream);margin-top:7px;line-height:1.45}

  .countdown{display:flex;justify-content:center;gap:clamp(6px,2vw,11px);
    margin:clamp(26px,6vw,36px) 0 0;animation-delay:1.4s}
  .cd-box{flex:1;max-width:72px;padding:clamp(11px,2.9vw,14px) 3px;border-radius:12px;
    background:rgba(255,255,255,.06);border:1px solid rgba(255,210,94,.25)}
  .cd-num{font-family:var(--display);font-weight:500;
    font-size:clamp(20px,5.6vw,27px);color:var(--yellow);line-height:1}
  .cd-lab{font-size:clamp(7px,2vw,9px);letter-spacing:2px;text-transform:uppercase;
    color:var(--mint);margin-top:8px}

  .footer{margin-top:clamp(24px,5.5vw,32px);font-size:clamp(13px,3.6vw,15px);
    color:var(--sky);animation-delay:1.6s;line-height:1.7;font-weight:400}
  @media (max-height:620px){.bow{width:84px;height:84px;margin-bottom:14px}.card{margin:18px auto}}
  @media (prefers-reduced-motion:reduce){*{animation-duration:.01ms !important;animation-iteration-count:1 !important}}
</style>
</head>
<body>
<div class="balloons" id="balloons"></div>
<div class="confetti" id="confetti"></div>
<div class="burst" id="burst"></div>

<div class="gate" id="gate">
  <div class="door left"><div class="boxline"></div><div class="ribbon-h"></div><div class="ribbon-v"></div></div>
  <div class="door right"><div class="boxline"></div><div class="ribbon-h"></div><div class="ribbon-v"></div></div>
  <div class="gate-center">
    <div class="bow">
      <svg viewBox="0 0 120 110" xmlns="http://www.w3.org/2000/svg">
        <path d="M56 40 C36 14 6 18 8 40 C10 60 40 56 56 44 Z" fill="#ff5f92"/>
        <path d="M64 40 C84 14 114 18 112 40 C110 60 80 56 64 44 Z" fill="#ff8ab3"/>
        <path d="M52 44 L36 92 L56 80 Z" fill="#e8467c"/>
        <path d="M68 44 L84 92 L64 80 Z" fill="#ff6f9c"/>
        <ellipse cx="60" cy="44" rx="13" ry="11" fill="#ffd25e"/>
      </svg>
      <span id="monogram">A</span>
    </div>
    <div class="tap-hint">Açmaq üçün toxunun<small>🎁</small></div>
  </div>
</div>

<main class="card" id="card">
  <div class="eyebrow reveal" id="topText">Ad günü şənliyimə dəvətlisiniz</div>
  <svg class="cake reveal" viewBox="0 0 100 110" xmlns="http://www.w3.org/2000/svg">
    <ellipse class="flame" cx="50" cy="18" rx="6" ry="10" fill="#ffd25e"/>
    <rect x="47" y="26" width="6" height="16" rx="2" fill="#fff6ee"/>
    <path d="M14 50 H86 V64 H14 Z" fill="#ff6f9c"/>
    <path d="M14 50 Q26 60 38 50 Q50 60 62 50 Q74 60 86 50 V56 H14 Z" fill="#fff6ee"/>
    <path d="M10 64 H90 V84 H10 Z" fill="#5fe0c0"/>
    <path d="M6 84 H94 V100 H6 Z" fill="#63b8ff"/>
    <circle cx="28" cy="74" r="3" fill="#ffd25e"/><circle cx="50" cy="74" r="3" fill="#ffd25e"/>
    <circle cx="72" cy="74" r="3" fill="#ffd25e"/>
  </svg>
  <div class="yas reveal" id="yasText">7</div>
  <div class="ad reveal" id="adText">Aylin</div>
  <div class="sub reveal" id="subText">şam üfürürük, şirniyyat yeyirik, çox əylənirik</div>
  <div class="rule"></div>
  <div class="detail reveal"><div class="label">Tarix</div><div class="value" id="dateText">12 Sentyabr 2026 · Şənbə · 15:00</div></div>
  <div class="detail reveal"><div class="label">Ünvan</div><div class="value" id="venueText">Bulud Uşaq Klubu, Bakı</div></div>
  <div class="countdown" id="countdown"></div>
  <div class="footer reveal" id="footerText">Gəlin, birlikdə şənlənək!</div>
</main>

<script>
/* ===== BURANI DƏYİŞ ===== */
const MELUMAT = {
  monoqram:"A",                 // hədiyyə bantındakı hərf
  ad:"Aylin",
  yas:"7",                      // yaş — böyüklər üçün boş qoy: ""
  ustYazi:"Ad günü şənliyimə dəvətlisiniz",
  altYazi:"şam üfürürük, şirniyyat yeyirik, çox əylənirik",
  tarixYazi:"12 Sentyabr 2026 · Şənbə · 15:00",
  mekan:"Bulud Uşaq Klubu, Bakı",
  sonYazi:"Gəlin, birlikdə şənlənək!",
  tedbirTarixi:"2026-09-12T15:00:00"
};
/* ===== BURANI DƏYİŞ ===== */

const $=id=>document.getElementById(id);
$("monogram").textContent=MELUMAT.monoqram;
$("adText").textContent=MELUMAT.ad;
if(MELUMAT.yas){$("yasText").textContent=MELUMAT.yas;} else {$("yasText").style.display="none";}
$("topText").textContent=MELUMAT.ustYazi; $("subText").textContent=MELUMAT.altYazi;
$("dateText").textContent=MELUMAT.tarixYazi; $("venueText").textContent=MELUMAT.mekan;
$("footerText").textContent=MELUMAT.sonYazi;
document.title=MELUMAT.ad+" — Ad Günü Dəvətnaməsi";

const colors=["#ff6f9c","#ffd25e","#5fe0c0","#63b8ff","#ff8a5b","#c78bff"];
const small=window.innerWidth<600;

// şarlar
const bw=$("balloons");
for(let i=0;i<(small?5:9);i++){
  const c=colors[i%colors.length];
  const b=document.createElement("div");b.className="balloon";
  b.style.left=(4+Math.random()*90)+"vw";
  b.style.animationDuration=(20+Math.random()*16)+"s";
  b.style.animationDelay=(Math.random()*18)+"s";
  b.innerHTML=`<div class="in"><svg viewBox="0 0 60 96" xmlns="http://www.w3.org/2000/svg">
    <ellipse cx="30" cy="34" rx="26" ry="32" fill="${c}"/>
    <ellipse cx="21" cy="24" rx="7" ry="10" fill="#ffffff" opacity=".3"/>
    <path d="M30 66 L25 74 L35 74 Z" fill="${c}"/>
    <path d="M30 74 Q36 84 28 96" stroke="#ffffff" stroke-opacity=".45" stroke-width="1.5" fill="none"/>
  </svg></div>`;
  bw.appendChild(b);
}
// konfetti
const cf=$("confetti");
for(let i=0;i<(small?16:30);i++){
  const c=document.createElement("div");c.className="conf";
  c.style.background=colors[i%colors.length];
  c.style.width=(4+Math.random()*4)+"px";
  c.style.height=(8+Math.random()*8)+"px";
  c.style.left=Math.random()*100+"vw";
  c.style.animationDuration=(7+Math.random()*7)+"s";
  c.style.animationDelay=(Math.random()*9)+"s";
  cf.appendChild(c);
}

const gate=$("gate"),card=$("card"),burst=$("burst");
document.body.classList.add("locked");
let opened=false;
function openGate(e){
  if(opened)return;if(e)e.preventDefault();opened=true;
  gate.classList.add("open");card.classList.add("revealed");
  // konfetti partlayışı
  burst.classList.add("on");
  for(let i=0;i<(small?40:70);i++){
    const p=document.createElement("div");p.className="bp";
    const a=Math.random()*Math.PI*2, d=120+Math.random()*(small?260:460);
    p.style.setProperty("--tx",(Math.cos(a)*d)+"px");
    p.style.setProperty("--ty",(Math.sin(a)*d)+"px");
    p.style.background=colors[i%colors.length];
    p.style.animationDelay=(Math.random()*.25)+"s";
    burst.appendChild(p);
  }
  setTimeout(()=>{burst.classList.remove("on");burst.innerHTML="";},2600);
  setTimeout(()=>{gate.classList.add("gone");document.body.classList.remove("locked")},2100);
}
gate.addEventListener("pointerdown",openGate);
gate.addEventListener("click",openGate);
gate.addEventListener("touchstart",openGate,{passive:false});

const wd=new Date(MELUMAT.tedbirTarixi),lb=["Gün","Saat","Dəq","San"],cd=$("countdown");
function r(){const d=wd-new Date();let v=[0,0,0,0];
  if(d>0)v=[Math.floor(d/864e5),Math.floor(d/36e5)%24,Math.floor(d/6e4)%60,Math.floor(d/1e3)%60];
  cd.innerHTML=v.map((x,i)=>`<div class="cd-box"><div class="cd-num">${String(x).padStart(2,"0")}</div><div class="cd-lab">${lb[i]}</div></div>`).join("");}
r();setInterval(r,1000);
</script>
</body>
</html>
