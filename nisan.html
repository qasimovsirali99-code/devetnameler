<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#f3dcd8">
<title>Nişan Dəvətnaməsi</title>
<meta property="og:title" content="Nişan Dəvətnaməsi">
<meta property="og:description" content="Nişan mərasimimizə dəvətlisiniz">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&family=Jost:wght@200;300;400&display=swap&subset=latin-ext" rel="stylesheet">
<style>
  :root{
    --blush:#f6e3de; --blush2:#eccfc8; --rose:#c98b78; --rose-d:#a76b58;
    --mauve:#6b4a52; --mauve-d:#4a3238; --ivory:#fdf9f6;
    --display:"Cormorant Garamond",Georgia,serif;
    --sans:"Jost","Segoe UI",sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overflow-x:hidden}
  body{
    font-family:var(--sans);font-weight:300;
    background:radial-gradient(ellipse at 50% 12%,#fdf5f2 0%,#f6e3de 45%,#e4c7c0 100%);
    background-attachment:fixed;
    color:var(--mauve);min-height:100vh;min-height:100dvh;
    display:flex;align-items:center;justify-content:center;position:relative;
    -webkit-text-size-adjust:100%;
  }
  body.locked{overflow:hidden;position:fixed;width:100%}

  .glowtop{position:fixed;top:-20%;left:50%;transform:translateX(-50%);
    width:min(110vw,760px);height:min(110vw,760px);z-index:0;pointer-events:none;
    background:radial-gradient(circle,rgba(255,255,255,.75),transparent 62%);
    animation:breathe 9s ease-in-out infinite}
  @keyframes breathe{0%,100%{opacity:.6}50%{opacity:1}}

  .motes{position:fixed;inset:0;z-index:1;pointer-events:none;overflow:hidden}
  .motes i{position:absolute;border-radius:50%;background:var(--rose);opacity:0;
    animation:rise linear infinite}
  @keyframes rise{
    0%{transform:translate3d(0,20px,0);opacity:0}
    18%{opacity:.4}78%{opacity:.4}
    100%{transform:translate3d(26px,-104vh,0);opacity:0}
  }

  /* ===== QAPI: oval çərçivəli blush panellər ===== */
  .gate{position:fixed;inset:0;z-index:20;display:flex;perspective:1700px;cursor:pointer;overflow:hidden;touch-action:manipulation}
  .gate.open{pointer-events:none}
  .gate.gone{display:none}
  .door{position:relative;width:50.2%;height:100%;
    background:linear-gradient(170deg,#fdf6f3,#eccfc8);
    transition:transform 2.2s cubic-bezier(.58,0,.16,1);
    transform-style:preserve-3d;backface-visibility:hidden;will-change:transform;overflow:hidden}
  .door.left{transform-origin:left center;box-shadow:inset -28px 0 60px rgba(107,74,82,.09)}
  .door.right{transform-origin:right center;box-shadow:inset 28px 0 60px rgba(107,74,82,.09)}
  .gate.open .door.left{transform:rotateY(-102deg)}
  .gate.open .door.right{transform:rotateY(102deg)}
  /* oval haşiyə */
  .oval{position:absolute;top:clamp(26px,7vw,52px);bottom:clamp(26px,7vw,52px);
    left:clamp(20px,5vw,40px);right:clamp(20px,5vw,40px);
    border:1.5px solid var(--rose);opacity:.6}
  .door.left .oval{border-right:none;border-radius:50% 0 0 50% / 40% 0 0 40%}
  .door.right .oval{border-left:none;border-radius:0 50% 50% 0 / 0 40% 40% 0}
  .handle{position:absolute;top:50%;transform:translateY(-50%);
    width:clamp(8px,2vw,11px);height:clamp(8px,2vw,11px);border-radius:50%;
    background:linear-gradient(180deg,#e6b5a4,var(--rose-d));
    box-shadow:0 2px 8px rgba(167,107,88,.4)}
  .door.left .handle{right:clamp(16px,4vw,32px)}
  .door.right .handle{left:clamp(16px,4vw,32px)}

  .gate-center{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
    z-index:2;text-align:center;pointer-events:none;width:90%;transition:opacity .55s ease}
  .gate.open .gate-center{opacity:0}
  .mono{font-family:var(--display);font-weight:300;
    font-size:clamp(42px,13vw,66px);color:var(--mauve);letter-spacing:1px;line-height:1}
  .mono-rule{width:clamp(36px,10vw,58px);height:1px;background:var(--rose);
    margin:clamp(18px,4.5vw,26px) auto}
  .tap-hint{font-size:clamp(9px,2.6vw,11px);letter-spacing:6px;text-transform:uppercase;color:var(--rose-d)}
  .tap-hint small{display:block;margin-top:12px;font-size:clamp(16px,4.4vw,20px);letter-spacing:0;
    animation:tapper 1.8s ease-in-out infinite}
  @keyframes tapper{0%,100%{transform:translateY(0);opacity:.45}50%{transform:translateY(-8px);opacity:1}}

  /* ===== KART ===== */
  .card{position:relative;z-index:5;width:min(90vw,520px);
    margin:clamp(24px,7vw,48px) auto;
    padding:clamp(40px,10vw,62px) clamp(26px,7vw,46px) clamp(34px,8vw,50px);
    text-align:center;background:var(--ivory);border-radius:3px;
    box-shadow:0 2px 6px rgba(107,74,82,.05), 0 22px 60px rgba(107,74,82,.16)}
  .card::before{content:"";position:absolute;inset:clamp(9px,2.4vw,14px);
    border:1px solid rgba(201,139,120,.3);border-radius:2px;pointer-events:none}

  .reveal{opacity:0;transform:translateY(18px)}
  .revealed .reveal{animation:up 1s cubic-bezier(.2,.7,.3,1) forwards}
  @keyframes up{to{opacity:1;transform:translateY(0)}}

  /* ÜZÜK — açılanda özü çəkilir */
  .ring{width:clamp(64px,17vw,88px);margin:0 auto clamp(18px,4.5vw,26px);animation-delay:.3s}
  .ring path,.ring circle{fill:none;stroke:var(--rose);stroke-width:2.2;
    stroke-linecap:round;stroke-dasharray:300;stroke-dashoffset:300}
  .revealed .ring path,.revealed .ring circle{animation:draw 2s ease .8s forwards}
  @keyframes draw{to{stroke-dashoffset:0}}
  .ring .gem{fill:var(--rose);stroke:none;opacity:0}
  .revealed .ring .gem{animation:gemin .8s ease 2.5s forwards}
  @keyframes gemin{to{opacity:1}}

  .eyebrow{font-size:clamp(9px,2.6vw,11px);letter-spacing:7px;text-transform:uppercase;
    color:var(--rose-d);animation-delay:.45s}

  .names{font-family:var(--display);font-weight:300;
    font-size:clamp(34px,11vw,56px);line-height:1.08;color:var(--mauve-d);
    margin:clamp(18px,5vw,28px) 0 0;overflow-wrap:break-word}
  .name{animation-delay:.7s}
  .amp{display:block;font-family:var(--display);font-style:italic;
    font-size:clamp(20px,5.2vw,26px);color:var(--rose);
    margin:clamp(4px,1.4vw,8px) 0;animation-delay:.85s}
  .amp2{animation-delay:1s}

  .sub{font-family:var(--display);font-style:italic;font-weight:300;
    font-size:clamp(15px,4.2vw,19px);color:var(--rose-d);
    margin-top:clamp(14px,3.6vw,20px);animation-delay:1.15s;line-height:1.55}

  .rule{margin:clamp(26px,6vw,36px) auto;width:0;height:1px;
    background:linear-gradient(90deg,transparent,var(--rose),transparent)}
  .revealed .rule{animation:grow 1.2s ease 1.3s forwards}
  @keyframes grow{to{width:82%}}

  .detail{margin:clamp(14px,3.6vw,20px) 0;animation-delay:1.4s}
  .detail .label{font-size:clamp(8px,2.3vw,10px);letter-spacing:5px;text-transform:uppercase;color:var(--rose)}
  .detail .value{font-family:var(--display);font-size:clamp(18px,4.8vw,22px);
    color:var(--mauve-d);margin-top:8px;line-height:1.45}

  .countdown{display:flex;justify-content:center;gap:clamp(5px,1.8vw,10px);
    margin:clamp(28px,6.5vw,38px) 0 0;animation-delay:1.6s}
  .cd-box{flex:1;max-width:70px;padding:clamp(11px,2.9vw,14px) 3px;border-radius:2px;
    background:rgba(201,139,120,.08)}
  .cd-num{font-family:var(--display);font-size:clamp(21px,5.8vw,28px);color:var(--mauve-d);line-height:1}
  .cd-lab{font-size:clamp(7px,2vw,9px);letter-spacing:2.5px;text-transform:uppercase;
    color:var(--rose-d);margin-top:8px}

  .footer{margin-top:clamp(24px,5.5vw,32px);font-family:var(--display);font-style:italic;
    font-size:clamp(14px,3.8vw,16px);color:var(--rose-d);animation-delay:1.8s;line-height:1.7}
  @media (max-height:620px){.mono{font-size:40px}.card{margin:18px auto}}
  @media (prefers-reduced-motion:reduce){*{animation-duration:.01ms !important;animation-iteration-count:1 !important}}
</style>
</head>
<body>
<div class="glowtop"></div>
<div class="motes" id="motes"></div>

<div class="gate" id="gate">
  <div class="door left"><div class="oval"></div><div class="handle"></div></div>
  <div class="door right"><div class="oval"></div><div class="handle"></div></div>
  <div class="gate-center">
    <div class="mono" id="monogram">A&amp;R</div>
    <div class="mono-rule"></div>
    <div class="tap-hint">Açmaq üçün toxunun<small>↔</small></div>
  </div>
</div>

<main class="card" id="card">
  <svg class="ring reveal" viewBox="0 0 100 110" xmlns="http://www.w3.org/2000/svg">
    <circle cx="50" cy="70" r="30"/>
    <path d="M50 40 L38 26 L50 10 L62 26 Z"/>
    <path class="gem" d="M50 40 L38 26 L50 10 L62 26 Z"/>
  </svg>
  <div class="eyebrow reveal" id="topText">Nişan mərasimimizə dəvətlisiniz</div>
  <h1 class="names">
    <div class="name reveal" id="name1">Aynur</div>
    <span class="amp reveal">&amp;</span>
    <div class="name reveal amp2" id="name2">Rəşad</div>
  </h1>
  <div class="sub reveal" id="subText">sözümüzü kəsdik — sevincimizi bölüşün</div>
  <div class="rule"></div>
  <div class="detail reveal"><div class="label">Tarix</div><div class="value" id="dateText">12 Sentyabr 2026 · Şənbə · 18:00</div></div>
  <div class="detail reveal"><div class="label">Ünvan</div><div class="value" id="venueText">Gül Palace, Bakı</div></div>
  <div class="countdown" id="countdown"></div>
  <div class="footer reveal" id="footerText">Bu xoş günümüzdə sizi aramızda görmək istəyirik</div>
</main>

<script>
/* ===== BURANI DƏYİŞ ===== */
const MELUMAT = {
  monoqram:"A&R", ad1:"Aynur", ad2:"Rəşad",
  ustYazi:"Nişan mərasimimizə dəvətlisiniz",
  altYazi:"sözümüzü kəsdik — sevincimizi bölüşün",
  tarixYazi:"12 Sentyabr 2026 · Şənbə · 18:00",
  mekan:"Gül Palace, Bakı",
  sonYazi:"Bu xoş günümüzdə sizi aramızda görmək istəyirik",
  tedbirTarixi:"2026-09-12T18:00:00"
};
/* ===== BURANI DƏYİŞ ===== */

const $=id=>document.getElementById(id);
$("monogram").textContent=MELUMAT.monoqram; $("name1").textContent=MELUMAT.ad1;
$("name2").textContent=MELUMAT.ad2; $("topText").textContent=MELUMAT.ustYazi;
$("subText").textContent=MELUMAT.altYazi; $("dateText").textContent=MELUMAT.tarixYazi;
$("venueText").textContent=MELUMAT.mekan; $("footerText").textContent=MELUMAT.sonYazi;
document.title=MELUMAT.ad1+" & "+MELUMAT.ad2+" — Nişan Dəvətnaməsi";

const small=window.innerWidth<600, mw=$("motes");
for(let i=0;i<(small?12:22);i++){
  const m=document.createElement("i");
  const s=1.5+Math.random()*3;
  m.style.width=s+"px";m.style.height=s+"px";
  m.style.left=Math.random()*100+"vw";m.style.bottom="-20px";
  m.style.animationDuration=(14+Math.random()*13)+"s";
  m.style.animationDelay=(Math.random()*15)+"s";
  mw.appendChild(m);
}

const gate=$("gate"),card=$("card");
document.body.classList.add("locked");
let opened=false;
function openGate(e){if(opened)return;if(e)e.preventDefault();opened=true;
  gate.classList.add("open");card.classList.add("revealed");
  setTimeout(()=>{gate.classList.add("gone");document.body.classList.remove("locked")},2300);}
gate.addEventListener("pointerdown",openGate);
gate.addEventListener("click",openGate);
gate.addEventListener("touchstart",openGate,{passive:false});

const wd=new Date(MELUMAT.tedbirTarixi),lb=["Gün","Saat","Dəq","San"],cd=$("countdown");
function r(){const d=wd-new Date();let v=[0,0,0,0];
  if(d>0)v=[Math.floor(d/864e5),Math.floor(d/36e5)%24,Math.floor(d/6e4)%60,Math.floor(d/1e3)%60];
  cd.innerHTML=v.map((x,i)=>`<div class="cd-box"><div class="cd-num">${String(x).padStart(2,"0")}</div><div class="cd-lab">${lb[i]}</div></div>`).join("");}
r();setInterval(r,1000);
</script>
</body>
</html>
