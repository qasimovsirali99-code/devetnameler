<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#050403">
<title>Ləman &amp; Nadir — Toy Dəvətnaməsi</title>
<meta property="og:title" content="Ləman & Nadir — Toy Dəvətnaməsi">
<meta property="og:description" content="26 Sentyabr 2026 · Bərdə">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400;1,500;1,600;1,700&family=Jost:wght@200;300;400&display=swap&subset=latin-ext" rel="stylesheet">
<style>
  :root{
    --void:#050403; --coal:#0c0806;
    --amber:#ff9a2e; --amber-h:#ffe3a8; --amber-w:#fff6dc;
    --gold:#c99236; --gold-l:#eac489; --gold-h:#fff2d4; --gold-d:#6f4b12;
    --cream:#f6e9cd;
    --display:"Cormorant Garamond",Georgia,serif;
    --sans:"Jost","Segoe UI",sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overflow:hidden}
  body{font-family:var(--sans);font-weight:300;background:var(--void);color:var(--cream);
    -webkit-text-size-adjust:100%}
  .fx{position:fixed;width:0;height:0;overflow:hidden;pointer-events:none}

  /* ═════════════ SALON (arxa plan) ═════════════ */
  .hall{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;
    background:
      radial-gradient(ellipse 50% 34% at 50% 50%, rgba(255,171,68,.34), transparent 72%),
      radial-gradient(ellipse 84% 52% at 50% 80%, rgba(178,114,30,.22), transparent 74%),
      linear-gradient(180deg,#050403 0%,#160e05 22%,#301d08 48%,#1c1207 74%,#080503 100%)}
  .hallflick{position:absolute;inset:0;background:rgba(255,170,70,.05);
    animation:hf 5.5s ease-in-out infinite;mix-blend-mode:screen}
  @keyframes hf{0%,100%{opacity:.35}38%{opacity:.9}62%{opacity:.15}}

  .corridor{position:absolute;left:50%;top:38%;transform:translate(-50%,-50%);
    width:min(170vw,1300px);height:min(170vw,1300px);
    background:conic-gradient(from 203deg at 50% 50%,
      transparent 0deg, rgba(255,196,110,.08) 21deg, transparent 45deg,
      transparent 135deg, rgba(255,196,110,.08) 159deg, transparent 180deg);
    filter:blur(4px)}
  .vanish{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
    width:min(38vw,260px);height:min(46vh,340px);border-radius:50%;
    background:radial-gradient(ellipse,rgba(255,212,138,.46),rgba(255,160,54,.13) 44%,transparent 72%);
    animation:vp 6.5s ease-in-out infinite}
  @keyframes vp{0%,100%{opacity:.7}50%{opacity:1}}

  /* döşəmə + əks */
  .floor{position:absolute;left:0;right:0;bottom:0;height:34%;
    background:
      radial-gradient(ellipse 40% 100% at 50% 0%, rgba(255,176,72,.22), transparent 66%),
      linear-gradient(180deg,rgba(24,15,7,.2),rgba(8,5,3,.92));
    box-shadow:inset 0 22px 40px rgba(0,0,0,.6)}
  .floor::after{content:"";position:absolute;inset:0;opacity:.35;
    background:repeating-linear-gradient(180deg,transparent 0 7px,rgba(255,190,100,.05) 7px 8px);
    filter:blur(1px)}

  .pillar{position:absolute;top:0;bottom:0;width:min(10vw,100px);
    background:linear-gradient(90deg,rgba(5,4,3,.97),rgba(40,27,14,.45) 60%,transparent)}
  .pillar.r{right:0;transform:scaleX(-1)}
  .vig{position:absolute;inset:0;
    background:radial-gradient(ellipse 74% 62% at 50% 48%, transparent 34%, rgba(5,4,3,.86) 100%)}

  .banner{position:absolute;top:-2%;transform-origin:50% 0;
    animation:bansway ease-in-out infinite;filter:drop-shadow(0 10px 26px rgba(0,0,0,.8))}
  @keyframes bansway{0%,100%{transform:rotate(-1.6deg)}50%{transform:rotate(1.6deg)}}
  .banner svg{width:100%;height:100%;display:block}

  .chand{position:absolute;transform-origin:50% 0;animation:chs ease-in-out infinite}
  @keyframes chs{0%,100%{transform:rotate(-1.1deg)}50%{transform:rotate(1.1deg)}}
  .chand .bar{height:2px;border-radius:2px;
    background:linear-gradient(90deg,transparent,var(--gold-d),var(--gold-l),var(--gold-d),transparent);
    box-shadow:0 0 14px rgba(201,146,54,.55)}
  .chand .chain{position:absolute;left:50%;top:-100vh;width:1px;height:100vh;
    background:linear-gradient(180deg,transparent,rgba(201,146,54,.42))}
  .chand .row{display:flex;justify-content:space-around;margin-top:-2px}

  /* ŞAM — üç dərinlik qatı */
  .layer{position:absolute;inset:0}
  .layer.far{filter:blur(3.4px);opacity:.5}
  .layer.mid{filter:blur(1.1px);opacity:.82}
  .layer.near{opacity:1}
  .fc{position:absolute}
  .layer.mid .fc,.layer.near .fc{animation:bob ease-in-out infinite}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-11px)}}

  .wax{width:100%;border-radius:1px 1px 2px 2px;position:relative;
    background:linear-gradient(96deg,#fffaee 0%,#f4e7c8 34%,#dcc79c 68%,#b49b74 100%);
    box-shadow:0 2px 6px rgba(0,0,0,.7), inset -1.5px 0 4px rgba(0,0,0,.22)}
  .wax::before{content:"";position:absolute;top:0;left:12%;width:76%;height:18%;
    border-radius:0 0 50% 50%;background:#fffaee;opacity:.9}
  .flame{position:absolute;left:50%;bottom:100%;transform:translateX(-50%);
    border-radius:50% 50% 50% 50% / 68% 68% 32% 32%;
    background:radial-gradient(ellipse at 50% 78%,#fffdf2 0%,#ffe9a8 22%,#ffcb54 46%,#f5901c 72%,rgba(240,120,20,0) 96%);
    animation:flick ease-in-out infinite}
  .core{position:absolute;left:50%;bottom:100%;transform:translate(-50%,-14%);
    border-radius:50%;background:radial-gradient(circle,#fffdf5,rgba(255,240,190,0) 70%);
    animation:flick ease-in-out infinite}
  @keyframes flick{
    0%,100%{transform:translateX(-50%) scale(1,1);opacity:.96}
    19%{transform:translateX(-53%) scale(.86,1.22);opacity:1}
    43%{transform:translateX(-47%) scale(1.12,.86);opacity:.82}
    71%{transform:translateX(-51%) scale(.93,1.13);opacity:1}
  }
  .halo{position:absolute;left:50%;bottom:100%;transform:translate(-50%,30%);border-radius:50%;
    background:radial-gradient(circle,rgba(255,180,78,.55),rgba(255,150,50,.12) 42%,transparent 70%);
    animation:hp ease-in-out infinite;mix-blend-mode:screen}
  @keyframes hp{0%,100%{opacity:.5;transform:translate(-50%,30%) scale(1)}
    50%{opacity:.95;transform:translate(-50%,30%) scale(1.28)}}

  .crowd{position:absolute;left:0;right:0;bottom:0;height:min(19vh,180px);opacity:.94;filter:blur(1.4px)}
  .crowd svg{width:100%;height:100%;display:block}

  .embers{position:absolute;inset:0}
  .embers i{position:absolute;border-radius:50%;background:var(--amber-h);opacity:0;
    animation:eup linear infinite;mix-blend-mode:screen}
  @keyframes eup{0%{transform:translate3d(0,0,0);opacity:0}
    13%{opacity:.9}64%{opacity:.5}100%{transform:translate3d(30px,-92vh,0);opacity:0}}

  /* ═════════════ QAPI ═════════════ */
  .gate{position:fixed;inset:0;z-index:40;cursor:pointer;overflow:hidden;touch-action:manipulation}
  .gate.open{pointer-events:none}
  .gate.gone{display:none}

  /* aralıqdan işıq */
  .gapcore{position:absolute;left:50%;top:0;bottom:0;transform:translateX(-50%);
    width:min(5vw,40px);z-index:4;pointer-events:none;
    background:linear-gradient(90deg,transparent,rgba(255,204,120,.7) 32%,#fff3d6 50%,rgba(255,204,120,.7) 68%,transparent);
    filter:blur(5px);animation:gg 3.6s ease-in-out infinite;mix-blend-mode:screen}
  @keyframes gg{0%,100%{opacity:.72}50%{opacity:1}}
  .gapbeams{position:absolute;left:50%;top:0;bottom:0;transform:translateX(-50%);
    width:min(78vw,540px);z-index:3;pointer-events:none;opacity:.42;mix-blend-mode:screen;
    background:repeating-conic-gradient(from 79deg at 50% 26%,
      rgba(255,210,130,.2) 0 1.3deg, transparent 1.3deg 6.6deg);
    filter:blur(2.5px);animation:gg 5s ease-in-out infinite}

  .doors{position:absolute;inset:0;display:flex;perspective:1400px;z-index:2}
  .door{position:relative;width:49.1%;height:100%;
    transition:transform 3s cubic-bezier(.46,0,.12,1);
    transform-style:preserve-3d;backface-visibility:hidden;will-change:transform;overflow:hidden;
    background:#1c1207}
  .door.left{transform-origin:left center}
  .door.right{margin-left:1.8%;transform-origin:right center}
  .gate.open .door.left{transform:rotateY(-94deg)}
  .gate.open .door.right{transform:rotateY(94deg)}

  /* taxta dokusu (SVG filtri) */
  .grain{position:absolute;inset:0;width:100%;height:100%}
  /* şaquli taxta lövhələr — bir-birindən kölgə ilə ayrılır */
  .planks{position:absolute;inset:0;display:flex}
  .planks span{flex:1;
    box-shadow:inset -2px 0 5px rgba(0,0,0,.55), inset 2px 0 3px rgba(255,190,110,.05)}
  .planks span:nth-child(odd){background:rgba(0,0,0,.10)}
  .planks span:nth-child(3n){background:rgba(255,180,90,.03)}

  /* aralıqdan qapıya düşən işıq */
  .spill{position:absolute;top:0;bottom:0;width:46%;z-index:3;pointer-events:none;
    mix-blend-mode:screen;animation:gg 4.4s ease-in-out infinite}
  .door.left .spill{right:0;
    background:linear-gradient(270deg,rgba(255,196,104,.34),rgba(255,180,80,.10) 34%,transparent 72%)}
  .door.right .spill{left:0;
    background:linear-gradient(90deg,rgba(255,196,104,.34),rgba(255,180,80,.10) 34%,transparent 72%)}

  /* oyma panellər — bevel */
  .panels{position:absolute;inset:min(6.4vw,52px) min(6.4vw,52px);
    display:flex;flex-direction:column;gap:min(2.4vh,20px);z-index:2}
  .panels div{flex:1;border-radius:2px;position:relative;
    box-shadow:
      inset 3px 3px 6px rgba(0,0,0,.72),
      inset -3px -3px 6px rgba(255,186,100,.09),
      0 1px 0 rgba(255,190,110,.07)}
  .panels div::after{content:"";position:absolute;inset:min(1.6vw,12px);
    border:1px solid rgba(201,146,54,.34);border-radius:2px;
    box-shadow:inset 0 0 18px rgba(201,146,54,.07)}

  /* dəmir bandlar + pərçimlər */
  .strap{position:absolute;left:0;right:0;height:min(3.4vh,26px);z-index:3;
    background:linear-gradient(180deg,#3a332c,#171310 45%,#26201a);
    box-shadow:0 3px 8px rgba(0,0,0,.7), inset 0 1px 0 rgba(255,200,130,.10)}
  .strap::after{content:"";position:absolute;inset:0;
    background:repeating-radial-gradient(circle at 14px 50%,
      rgba(255,214,150,.24) 0 1.6px, rgba(0,0,0,.5) 2.2px 3.4px, transparent 3.6px 40px)}
  .strap.s1{top:16%}
  .strap.s2{bottom:18%}

  /* medalyon */
  .medal{position:absolute;top:min(20vh,168px);left:50%;transform:translateX(-50%);
    width:min(15.5vw,102px);height:min(15.5vw,102px);z-index:4;
    display:flex;align-items:center;justify-content:center;
    filter:drop-shadow(0 5px 12px rgba(0,0,0,.85))}
  .medal svg{position:absolute;inset:0;width:100%;height:100%}
  .medal span{position:relative;z-index:2;font-family:var(--display);font-weight:600;
    font-size:min(4.4vw,28px);
    background:linear-gradient(160deg,#fff3d4 0%,#e0b263 34%,#8a6220 58%,#f0d193 82%,#c2933a 100%);
    -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
    filter:drop-shadow(0 1px 1px rgba(0,0,0,.6))}

  /* halqa qulp + arxa lövhə */
  .knock{position:absolute;top:50%;transform:translateY(-50%);z-index:4;
    width:min(7.6vw,50px);height:min(7.6vw,50px);
    display:flex;align-items:center;justify-content:center}
  .door.left .knock{right:min(5.6vw,44px)}
  .door.right .knock{left:min(5.6vw,44px)}
  .knock .plate{position:absolute;inset:0;border-radius:50%;
    background:radial-gradient(circle at 36% 30%,#4a4038,#1a1512 62%,#0d0a08);
    box-shadow:0 3px 9px rgba(0,0,0,.8), inset 0 1px 0 rgba(255,200,130,.14)}
  .knock .ring{position:absolute;width:74%;height:74%;border-radius:50%;
    border:min(1.5vw,9px) solid transparent;
    background:
      linear-gradient(#0000,#0000) padding-box,
      conic-gradient(from 210deg,#8a6220,#f2d79e 22%,#a97c26 45%,#6b4a12 62%,#e8c483 84%,#8a6220) border-box;
    box-shadow:0 3px 8px rgba(0,0,0,.75), inset 0 0 6px rgba(0,0,0,.5)}

  /* GOTİK DAŞ TAĞ */
  .archtop{position:absolute;top:0;left:0;right:0;height:min(30vh,300px);z-index:6;pointer-events:none}
  .archtop svg{width:100%;height:100%;display:block}

  /* FƏNƏRLƏR */
  .lant{position:absolute;top:0;z-index:7;width:min(7vw,48px);
    transform-origin:50% 0;animation:ls ease-in-out infinite;
    filter:drop-shadow(0 6px 14px rgba(0,0,0,.85))}
  .lant.l{left:min(4.5vw,64px)}
  .lant.r{right:min(4.5vw,64px)}
  @keyframes ls{0%,100%{transform:rotate(-1.7deg)}50%{transform:rotate(1.7deg)}}
  .lant .cord{width:1.5px;height:min(6.5vh,58px);margin:0 auto;
    background:linear-gradient(180deg,rgba(150,110,50,.75),rgba(190,145,70,.5))}
  .lant .cap{width:70%;height:min(1.1vh,9px);margin:0 auto;border-radius:2px 2px 0 0;
    background:linear-gradient(180deg,#8a6220,#4a340f)}
  .lant .box{position:relative;height:min(8.6vh,62px);border-radius:2px;
    border:1.5px solid #6f4b12;
    background:linear-gradient(180deg,rgba(255,186,78,.26),rgba(255,140,40,.07));
    box-shadow:0 0 34px rgba(255,168,60,.42), inset 0 0 12px rgba(255,190,100,.2)}
  .lant .box::after{content:"";position:absolute;inset:0;
    background:linear-gradient(90deg,transparent 46%,rgba(111,75,18,.85) 49%,transparent 53%)}
  .lant .lf{position:absolute;left:50%;bottom:32%;transform:translateX(-50%);
    width:min(2.2vw,13px);height:min(2.7vh,21px);
    border-radius:50% 50% 50% 50% / 68% 68% 32% 32%;
    background:radial-gradient(ellipse at 50% 78%,#fffdf2,#ffe9a8 24%,#ffcb54 48%,#f5901c 76%);
    box-shadow:0 0 30px 10px rgba(255,168,60,.55);animation:flick .68s ease-in-out infinite}

  /* ÖNDƏKİ ŞAM CƏRGƏLƏRİ */
  .tapers{position:absolute;inset:0;z-index:8;pointer-events:none;overflow:hidden}
  .tapers .t{position:absolute;animation:tsw ease-in-out infinite}
  @keyframes tsw{0%,100%{transform:translateY(0)}50%{transform:translateY(-2.5px)}}
  .tapers .t.blur1{filter:blur(1.6px);opacity:.7}
  .tapers .t.blur2{filter:blur(3.2px);opacity:.45}

  /* rəng koreksiyası + film dənəsi */
  .grade{position:fixed;inset:0;z-index:30;pointer-events:none;mix-blend-mode:soft-light;
    background:radial-gradient(ellipse 70% 56% at 50% 46%, rgba(255,186,96,.5), rgba(20,8,0,.7) 100%)}
  .noise{position:fixed;inset:0;z-index:31;pointer-events:none;opacity:.055;
    mix-blend-mode:overlay}
  .noise svg{width:100%;height:100%}

  /* açılış parlaması */
  .bloom{position:fixed;inset:0;z-index:39;pointer-events:none;opacity:0;
    background:radial-gradient(ellipse 46% 40% at 50% 50%, rgba(255,232,180,.85), transparent 70%);
    mix-blend-mode:screen}
  .gate.open ~ .bloom, .bloom.fire{animation:bl 2.4s ease-out forwards}
  @keyframes bl{0%{opacity:0}18%{opacity:.85}100%{opacity:0}}

  /* qapı yazıları */
  .gatetext{position:absolute;inset:0;z-index:10;
    display:flex;flex-direction:column;align-items:center;justify-content:space-between;
    padding:min(5.6vh,44px) min(5vw,30px) min(6.4vh,50px);
    text-align:center;pointer-events:none;transition:opacity .9s ease}
  .gate.open .gatetext{opacity:0}
  .gt{font-size:min(2.6vw,11px);letter-spacing:7px;text-transform:uppercase;
    color:var(--gold-l);text-shadow:0 2px 20px rgba(0,0,0,.98),0 0 22px rgba(255,180,80,.35)}
  .gb{font-size:min(2.5vw,11px);letter-spacing:6px;text-transform:uppercase;
    color:var(--gold);text-shadow:0 2px 20px rgba(0,0,0,.98)}
  .gb small{display:block;margin-top:11px;font-size:min(3.8vw,18px);letter-spacing:0;
    animation:tp 1.9s ease-in-out infinite}
  @keyframes tp{0%,100%{transform:translateY(0);opacity:.4}50%{transform:translateY(-9px);opacity:1}}
  @media (max-width:540px){.gt,.gb{font-size:10px;letter-spacing:4.5px}.medal span{font-size:17px}}

  /* ═════════════ DƏVƏTNAMƏ (tək ekran) ═════════════ */
  .stage{position:fixed;inset:0;z-index:20;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:min(1.8vh,17px);padding:max(2.2vh,12px) min(5vw,30px) max(1.8vh,10px);
    text-align:center;overflow:hidden}
  @media (max-height:520px){.stage{overflow-y:auto;justify-content:flex-start;gap:8px}}

  .rv{opacity:0;transform:translateY(20px);
    transition:opacity 1.2s ease, transform 1.2s cubic-bezier(.2,.7,.3,1)}
  .go .rv{opacity:1;transform:translateY(0)}
  .t1{transition-delay:.5s}.t2{transition-delay:.7s}.t3{transition-delay:.9s}
  .t4{transition-delay:1.15s}.t5{transition-delay:1.35s}.t6{transition-delay:1.55s}
  .t7{transition-delay:1.75s}

  .eyebrow{font-size:min(2.9vw,12px);letter-spacing:4.5px;text-transform:uppercase;
    color:var(--gold-l);line-height:2;text-shadow:0 2px 22px rgba(0,0,0,.95);max-width:26ch}
  @media (max-width:540px){.eyebrow{font-size:10px;letter-spacing:3.2px}}

  .flr{display:flex;align-items:center;justify-content:center;gap:9px;color:var(--gold)}
  .flr .ln{width:min(8vw,54px);height:1px;background:linear-gradient(90deg,transparent,var(--gold))}
  .flr .ln.b{background:linear-gradient(270deg,transparent,var(--gold))}
  .flr .gm{font-size:min(2.6vw,12px);letter-spacing:3px}

  .namewrap{position:relative;display:inline-block;padding:min(1.5vh,13px) min(3vw,26px)}
  .swirl{position:absolute;inset:-15% -13%;pointer-events:none}
  .swirl path{fill:none;stroke:url(#sw);stroke-width:2.4;stroke-linecap:round;
    stroke-dasharray:1300;stroke-dashoffset:1300;
    filter:drop-shadow(0 0 10px rgba(255,208,128,.85))}
  .go .swirl path{animation:tr 3.2s cubic-bezier(.34,.1,.24,1) 1.2s forwards}
  @keyframes tr{to{stroke-dashoffset:0}}
  .swirl .sp{fill:#fff6dc;opacity:0;filter:drop-shadow(0 0 9px rgba(255,235,180,.95))}
  .go .swirl .sp{animation:spk 2.6s ease-in-out 3.6s infinite}
  @keyframes spk{0%,100%{opacity:.12;transform:scale(.7)}50%{opacity:1;transform:scale(1.4)}}

  /* metal qızıl adlar */
  .names{font-family:var(--display);font-weight:600;font-style:italic;
    font-size:min(11.5vw,7.4vh,90px);line-height:1;position:relative;z-index:2;
    background:linear-gradient(168deg,#fff6de 0%,#f0d69a 26%,#c9963c 48%,#8f671d 62%,#f4dfae 82%,#d3a44c 100%);
    -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
    filter:drop-shadow(0 0 26px rgba(255,190,90,.5)) drop-shadow(0 4px 18px rgba(0,0,0,.85))}
  .amp{display:block;font-size:.46em;font-weight:400;margin:.05em 0;opacity:.92}

  .quote{font-family:var(--display);font-weight:300;font-style:italic;
    font-size:min(4.1vw,2.45vh,22px);line-height:1.6;color:var(--cream);
    max-width:27ch;text-shadow:0 2px 24px rgba(0,0,0,.98)}

  .datewrap{display:flex;align-items:center;justify-content:center;gap:min(4vw,24px)}
  .dnum{font-family:var(--display);font-weight:400;
    font-size:min(13vw,8vh,88px);line-height:.9;
    background:linear-gradient(165deg,#fff6de,#e9c98a 40%,#b8862c 62%,#f2dcaa 90%);
    -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
    filter:drop-shadow(0 0 22px rgba(255,190,90,.45))}
  .dbar{width:1px;height:min(9vh,74px);background:linear-gradient(180deg,transparent,var(--gold),transparent)}
  .dtxt{text-align:left}
  .dmonth{font-size:min(4.2vw,2.6vh,22px);letter-spacing:3.5px;text-transform:uppercase;color:var(--cream)}
  .dyear{font-family:var(--display);font-size:min(5vw,3vh,27px);color:var(--gold-l);margin-top:2px}

  .place{font-size:min(2.9vw,1.85vh,12px);letter-spacing:3.4px;text-transform:uppercase;
    color:var(--gold-l);line-height:1.95;opacity:.92}

      <feColorMatrix in="n" type="saturate" values="0" result="m"/>

        <feDistantLight azimuth="212" elevation="56"/>

      <feComposite in="lit" in2="SourceGraphic" operator="in"/>
    </filter>
    <!-- daş -->
    <filter id="stoneF" x="0" y="0" width="100%" height="100%">

<script>
/* ══════════════════════════════════════════
   ↓↓↓  BURANI DƏYİŞ  ↓↓↓
   ══════════════════════════════════════════ */
const MELUMAT = {
  ad1:       "Ləman",
  ad2:       "Nadir",
  monoqram:  "L&N",
  qapiYazi:  "Toy Dəvətnaməsi",
  devetYazi: "Ən xüsusi günümüzə sizi də dəvət edirik",
  sitat:     "Bizim üçün bu gün xoşbəxtliyin zirvəsi deyil, başlanğıcıdır… Bu başlanğıca şahid olan hər kəs bizim üçün əzizdir!",
  gun:       "26",
  ay:        "Sentyabr",
  il:        "2026",
  mekan:     "Saat 17:00<br>Bərdə şəhəri · Gold Mətin Şadlıq Sarayı",
  sayimYazi: "Toy gününə qalan vaxt",
  sonYazi:   "Sizi yanımızda görməkdən böyük məmnunluq duyacağıq",

  // Geri sayım: "İL-AY-GÜNTsaat:dəqiqə:00"
  toyTarixi: "2026-09-26T17:00:00"
};
/* ══════════════════════════════════════════
   ↑↑↑  BURANI DƏYİŞ  ↑↑↑
   ══════════════════════════════════════════ */

const $=id=>document.getElementById(id);
const ini=MELUMAT.monoqram.replace(/[^\p{L}]/gu,"").split("");

$("name1").textContent=MELUMAT.ad1;
$("name2").textContent=MELUMAT.ad2;
$("med1").textContent=ini[0]||MELUMAT.ad1[0];
$("med2").textContent=ini[1]||MELUMAT.ad2[0];
$("gateTop").textContent=MELUMAT.qapiYazi;
$("inviteLine").textContent=MELUMAT.devetYazi;
$("quoteText").textContent=MELUMAT.sitat;
$("dayNum").textContent=MELUMAT.gun;
$("monthName").textContent=MELUMAT.ay;
$("yearNum").textContent=MELUMAT.il;
$("placeText").innerHTML=MELUMAT.mekan;
$("cdLabel").textContent=MELUMAT.sayimYazi;
$("finalText").textContent=MELUMAT.sonYazi;
$("envMono").textContent=MELUMAT.monoqram;
$("sealMono").textContent=MELUMAT.monoqram;
$("envNames").textContent=MELUMAT.ad1+" & "+MELUMAT.ad2;
$("envDate").textContent=(MELUMAT.gun+" "+MELUMAT.ay+" "+MELUMAT.il).toUpperCase();
document.title=MELUMAT.ad1+" & "+MELUMAT.ad2+" — Toy Dəvətnaməsi";

const small=window.innerWidth<600;

/* ── bayraqlar ── */
const banC=[["#57181f","#77242c"],["#152e49","#22436a"],["#16382a","#224d3d"],["#4a370c","#665014"]];
const bw=$("banners");
(small?[{l:3,w:9,h:28},{l:88,w:9,h:28}]
      :[{l:2,w:5.5,h:30},{l:12,w:4.6,h:25},{l:83,w:4.6,h:25},{l:93,w:5.5,h:30}]
).forEach((b,i)=>{
  const c=banC[i%banC.length];
  const el=document.createElement("div");el.className="banner";
  el.style.left=b.l+"vw";el.style.width=b.w+"vw";el.style.height=b.h+"vh";
  el.style.animationDuration=(5.5+Math.random()*3)+"s";
  el.style.animationDelay=(Math.random()*3)+"s";
  el.style.opacity=.74;
  el.innerHTML=`<svg viewBox="0 0 60 250" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
    <path d="M0 0 H60 V214 L30 250 L0 214 Z" fill="${c[0]}"/>
    <path d="M5 0 H55 V210 L30 241 L5 210 Z" fill="${c[1]}" opacity=".7"/>
    <path d="M0 0 H60 V9 H0 Z" fill="#6f4b12"/>
    <g stroke="#c99236" stroke-width="1.1" fill="none" opacity=".68">
      <path d="M13 42 H47 M13 48 H47"/>
      <path d="M30 66 L38 82 L30 98 L22 82 Z"/>
      <circle cx="30" cy="82" r="3.4" fill="#c99236" stroke="none"/>
      <path d="M30 118 L36 130 L30 142 L24 130 Z"/>
      <path d="M13 164 H47 M13 170 H47"/>
    </g>
    <path d="M0 214 L30 250 L60 214" fill="none" stroke="#6f4b12" stroke-width="1.4" opacity=".7"/>
  </svg>`;
  bw.appendChild(el);
});

/* ── çilçıraqlar ── */
const chw=$("chands");
(small?[{t:3,l:20,w:52},{t:11,l:58,w:40}]
      :[{t:2,l:17,w:17},{t:7,l:42,w:15},{t:4,l:68,w:16}]).forEach((c,i)=>{
  const el=document.createElement("div");el.className="chand";
  el.style.top=c.t+"vh";el.style.left=c.l+"vw";el.style.width=c.w+"vw";
  el.style.animationDuration=(6+i*1.8)+"s";el.style.animationDelay=(i*1.2)+"s";
  let cells="";
  for(let k=0;k<(small?4:5);k++){
    const w=small?7:9,h=small?15:21;
    cells+=`<div style="position:relative;width:${w}px">
      <div class="halo" style="width:${w*4}px;height:${w*4}px;animation-duration:${(2+Math.random()*1.6).toFixed(2)}s"></div>
      <div class="core" style="width:${(w*.8).toFixed(1)}px;height:${(w*.8).toFixed(1)}px;animation-duration:${(.6+Math.random()*.4).toFixed(2)}s"></div>
      <div class="flame" style="width:${w}px;height:${(h*.72).toFixed(1)}px;animation-duration:${(.6+Math.random()*.5).toFixed(2)}s;animation-delay:${(Math.random()*.8).toFixed(2)}s"></div>
      <div class="wax" style="height:${h}px"></div>
    </div>`;
  }
  el.innerHTML=`<div class="chain"></div><div class="bar"></div><div class="row">${cells}</div>`;
  chw.appendChild(el);
});

/* ── süzən şamlar: 3 dərinlik qatı ── */
function makeCandles(host,count,scale,animate){
  for(let i=0;i<count;i++){
    const w=(small?3.4:4.2)*scale+Math.random()*2*scale;
    const h=(small?9:12)*scale+Math.random()*(small?8:12)*scale;
    const el=document.createElement("div");el.className="fc";
    el.style.left=(1+Math.random()*98)+"vw";
    el.style.top=(3+Math.random()*58)+"vh";
    el.style.width=w.toFixed(1)+"px";
    if(animate){
      el.style.animationDuration=(3.2+Math.random()*3.6)+"s";
      el.style.animationDelay=(Math.random()*4)+"s";
    }
    el.innerHTML=`
      <div class="halo" style="width:${(h*2).toFixed(1)}px;height:${(h*2).toFixed(1)}px;animation-duration:${(2+Math.random()*1.8).toFixed(2)}s"></div>
      <div class="core" style="width:${(w*.85).toFixed(1)}px;height:${(w*.85).toFixed(1)}px;animation-duration:${(.6+Math.random()*.4).toFixed(2)}s"></div>
      <div class="flame" style="width:${(w*1.05).toFixed(1)}px;height:${(h*.72).toFixed(1)}px;animation-duration:${(.55+Math.random()*.55).toFixed(2)}s;animation-delay:${(Math.random()*.9).toFixed(2)}s"></div>
      <div class="wax" style="height:${h.toFixed(1)}px"></div>`;
    host.appendChild(el);
  }
}
makeCandles($("lFar"),  small?12:22, .7,  false);
makeCandles($("lMid"),  small?9:16,  1.0, true);
makeCandles($("lNear"), small?5:9,   1.4, true);

$("crowdG").innerHTML=cs;

/* ── qığılcımlar ── */
const ew=$("embers");
for(let i=0;i<(small?14:26);i++){
  const e=document.createElement("i");

/* ── qapı önündəki şam cərgələri (dərinlikli) ── */
const tw=$("tapers");
(small
 ? [{s:'l',x:1.5,b:1,h:20,z:0},{s:'l',x:7,b:8,h:15,z:1},{s:'l',x:2.5,b:24,h:11,z:2},
    {s:'r',x:1.5,b:2,h:22,z:0},{s:'r',x:7,b:10,h:14,z:1},{s:'r',x:2.5,b:26,h:10,z:2}]
 : [{s:'l',x:1,b:0,h:24,z:0},{s:'l',x:5,b:6,h:18,z:0},{s:'l',x:2,b:17,h:14,z:1},{s:'l',x:8,b:27,h:11,z:2},
    {s:'r',x:1,b:1,h:25,z:0},{s:'r',x:5,b:8,h:17,z:0},{s:'r',x:2,b:19,h:13,z:1},{s:'r',x:8,b:29,h:10,z:2}]
).forEach(t=>{
  const el=document.createElement("div");
  el.className="t"+(t.z===1?" blur1":t.z===2?" blur2":"");
  const w=(small?9:12)+Math.random()*(small?4:6);
  if(t.s==='l') el.style.left=t.x+"vw"; else el.style.right=t.x+"vw";
  el.style.bottom=t.b+"vh";
  el.style.width=w.toFixed(1)+"px";
  el.style.animationDuration=(4+Math.random()*3)+"s";
  el.style.animationDelay=(Math.random()*3)+"s";
  el.innerHTML=`
    <div class="halo" style="width:${(w*5.4).toFixed(0)}px;height:${(w*5.4).toFixed(0)}px;animation-duration:${(2.1+Math.random()*1.7).toFixed(2)}s"></div>
    <div class="core" style="width:${(w*.9).toFixed(1)}px;height:${(w*.9).toFixed(1)}px;animation-duration:${(.6+Math.random()*.4).toFixed(2)}s"></div>
    <div class="flame" style="width:${(w*.95).toFixed(1)}px;height:${(w*1.65).toFixed(1)}px;animation-duration:${(.58+Math.random()*.5).toFixed(2)}s;animation-delay:${(Math.random()*.9).toFixed(2)}s"></div>
    <div class="wax" style="height:${t.h}vh"></div>`;
  tw.appendChild(el);
});

/* ── qapını aç ── */
const gate=$("gate"), stage=$("stage"), bloom=$("bloom");
let opened=false;
function openGate(e){
  if(opened)return;
  if(e)e.preventDefault();
  opened=true;
  gate.classList.add("open");
  bloom.classList.add("fire");
  stage.classList.add("go");
  setTimeout(()=>gate.classList.add("gone"),3100);
}
gate.addEventListener("pointerdown",openGate);
gate.addEventListener("click",openGate);
gate.addEventListener("touchstart",openGate,{passive:false});

/* ── geri sayım ── */
const wd=new Date(MELUMAT.toyTarixi), lb=["Gün","Saat","Dəq","San"], cd=$("countdown");
function tick(){
  const d=wd-new Date(); let v=[0,0,0,0];
  if(d>0)v=[Math.floor(d/864e5),Math.floor(d/36e5)%24,Math.floor(d/6e4)%60,Math.floor(d/1e3)%60];
  cd.innerHTML=v.map((x,i)=>
    `<div class="cd"><div class="cdn">${String(x).padStart(2,"0")}</div><div class="cdl">${lb[i]}</div></div>`
  ).join("");
}
tick();setInterval(tick,1000);
