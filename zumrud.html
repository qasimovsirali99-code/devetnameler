<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#0a2e22">
<title>Toy Dəvətnaməsi — Zümrüd Məxmər</title>
<meta property="og:title" content="Toy Dəvətnaməsi">
<meta property="og:description" content="Toy şənliyimizə dəvətlisiniz">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300&family=Jost:wght@200;300;400&display=swap&subset=latin-ext" rel="stylesheet">
<style>
  :root{
    --em:#0a2e22; --em2:#123f30; --em3:#1c5a44; --em-d:#05201a;
    --gold:#cba75a; --gold-l:#f0dfae; --gold-d:#8f7333;
    --blush:#e3a89a; --pearl:#f8f4ea;
    --display:"Cormorant Garamond",Georgia,serif;
    --sans:"Jost","Segoe UI",sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overflow-x:hidden}
  body{
    font-family:var(--sans);font-weight:300;
    background:radial-gradient(ellipse at 50% 18%, #1c5a44 0%, #0d3527 45%, #05201a 100%);
    background-attachment:fixed;
    color:var(--pearl);min-height:100vh;min-height:100dvh;
    display:flex;align-items:center;justify-content:center;position:relative;
    -webkit-text-size-adjust:100%;
  }
  body.locked{overflow:hidden;position:fixed;width:100%}

  /* səhnə işığı */
  .spot{position:fixed;top:-25%;left:50%;transform:translateX(-50%);
    width:min(130vw,900px);height:min(130vw,900px);z-index:0;pointer-events:none;
    background:radial-gradient(circle,rgba(240,223,174,.16),transparent 62%);
    animation:breathe 8s ease-in-out infinite}
  @keyframes breathe{0%,100%{opacity:.7}50%{opacity:1}}

  /* qızıl zərrələr */
  .dust{position:fixed;inset:0;z-index:1;pointer-events:none;overflow:hidden}
  .dust i{position:absolute;border-radius:50%;background:var(--gold-l);opacity:0;
    animation:floaty linear infinite}
  @keyframes floaty{
    0%{transform:translate3d(0,20px,0);opacity:0}
    18%{opacity:.6}78%{opacity:.6}
    100%{transform:translate3d(28px,-104vh,0);opacity:0}
  }

  /* ===== MƏXMƏR PƏRDƏ ===== */
  .gate{position:fixed;inset:0;z-index:20;cursor:pointer;overflow:hidden;touch-action:manipulation}
  .gate.gone{display:none}
  .gate.open{pointer-events:none}
  /* pərdə karnizi */
  .rod{position:absolute;top:0;left:0;right:0;height:clamp(16px,4vw,26px);z-index:4;
    background:linear-gradient(180deg,var(--gold-l),var(--gold) 40%,var(--gold-d));
    box-shadow:0 4px 18px rgba(0,0,0,.5)}
  .curtain{position:absolute;top:0;bottom:0;width:52%;
    transition:transform 2.2s cubic-bezier(.55,0,.2,1);
    will-change:transform}
  .curtain.left{left:0;
    background:repeating-linear-gradient(90deg,
      #06251c 0 3px, #0d3d2d 3px 26px, #17553f 26px 40px, #0d3d2d 40px 58px);
    box-shadow:inset -28px 0 50px rgba(0,0,0,.55)}
  .curtain.right{right:0;
    background:repeating-linear-gradient(270deg,
      #06251c 0 3px, #0d3d2d 3px 26px, #17553f 26px 40px, #0d3d2d 40px 58px);
    box-shadow:inset 28px 0 50px rgba(0,0,0,.55)}
  .gate.open .curtain.left{transform:translateX(-104%)}
  .gate.open .curtain.right{transform:translateX(104%)}
  /* pərdənin alt qıvrımı */
  .curtain::after{content:"";position:absolute;bottom:0;left:0;right:0;height:clamp(30px,8vw,54px);
    background:repeating-radial-gradient(circle at 20px 0, rgba(0,0,0,.35) 0 20px, transparent 20px 42px)}
  /* qızıl saçaq */
  .curtain::before{content:"";position:absolute;top:0;left:0;right:0;height:clamp(10px,2.6vw,16px);
    background:repeating-linear-gradient(90deg,var(--gold) 0 4px, var(--gold-d) 4px 9px);
    opacity:.85;z-index:3}

  .gate-center{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
    z-index:5;text-align:center;pointer-events:none;width:90%;transition:opacity .5s ease}
  .gate.open .gate-center{opacity:0}
  .seal{width:clamp(96px,27vw,130px);height:clamp(96px,27vw,130px);
    margin:0 auto clamp(20px,4.5vw,28px);border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    background:radial-gradient(circle at 38% 34%,#1d6249,#0a2e22 70%);
    border:2px solid var(--gold);
    box-shadow:0 0 0 8px rgba(10,46,34,.75), 0 0 46px rgba(203,167,90,.35),
               0 14px 40px rgba(0,0,0,.55)}
  .seal span{font-family:var(--display);font-weight:400;
    font-size:clamp(28px,7.8vw,38px);color:var(--gold-l);letter-spacing:1px}
  .tap-hint{font-size:clamp(9px,2.7vw,11px);letter-spacing:6px;text-transform:uppercase;color:var(--gold)}
  .tap-hint small{display:block;margin-top:12px;font-size:clamp(18px,5vw,22px);letter-spacing:0;
    animation:tapper 1.7s ease-in-out infinite}
  @keyframes tapper{0%,100%{transform:translateY(0);opacity:.5}50%{transform:translateY(-8px);opacity:1}}

  /* ===== KART ===== */
  .card{position:relative;z-index:5;width:min(90vw,540px);
    margin:clamp(24px,7vw,48px) auto;
    padding:clamp(44px,10vw,66px) clamp(26px,7vw,46px) clamp(34px,8vw,50px);
    text-align:center;
    background:linear-gradient(170deg,rgba(18,63,48,.92),rgba(5,32,26,.94));
    border-radius:4px;
    border:1px solid rgba(203,167,90,.45);
    box-shadow:0 30px 90px rgba(0,0,0,.6), inset 0 0 90px rgba(203,167,90,.05);
    overflow:hidden}
  .card::before{content:"";position:absolute;inset:clamp(9px,2.4vw,14px);
    border:1px solid rgba(203,167,90,.25);border-radius:2px;pointer-events:none}
  .card::after{content:"";position:absolute;top:0;left:-60%;width:60%;height:100%;
    background:linear-gradient(90deg,transparent,rgba(240,223,174,.1),transparent)}
  .revealed.card::after{animation:shine 7s ease-in-out 1.4s infinite}
  @keyframes shine{0%{left:-60%}45%,100%{left:130%}}

  .reveal{opacity:0;transform:translateY(18px)}
  .revealed .reveal{animation:up 1s cubic-bezier(.2,.7,.3,1) forwards}
  @keyframes up{to{opacity:1;transform:translateY(0)}}

  .eyebrow{font-size:clamp(9px,2.6vw,11px);letter-spacing:7px;text-transform:uppercase;
    color:var(--gold);animation-delay:.25s}
  .wreath{margin:clamp(16px,4vw,24px) auto;width:clamp(40px,10vw,54px);height:1px;
    background:var(--gold);position:relative;animation-delay:.4s}
  .wreath::before,.wreath::after{content:"";position:absolute;top:50%;
    width:clamp(7px,1.9vw,9px);height:clamp(7px,1.9vw,9px);border-radius:50%;
    background:var(--blush);transform:translateY(-50%)}
  .wreath::before{left:-16px}.wreath::after{right:-16px}

  .names{font-family:var(--display);font-weight:300;
    font-size:clamp(34px,11vw,58px);line-height:1.08;color:var(--pearl);
    margin:clamp(4px,1.6vw,8px) 0;overflow-wrap:break-word}
  .name{animation-delay:.6s}
  .amp{display:block;font-family:var(--display);font-style:italic;
    font-size:clamp(20px,5.2vw,26px);color:var(--blush);
    margin:clamp(4px,1.4vw,8px) 0;animation-delay:.75s}
  .amp2{animation-delay:.9s}

  .sub{font-family:var(--display);font-style:italic;font-weight:300;
    font-size:clamp(15px,4.2vw,19px);color:var(--gold-l);
    margin-top:clamp(12px,3.2vw,18px);animation-delay:1.05s;line-height:1.55;opacity:.92}

  .rule{margin:clamp(26px,6vw,36px) auto;width:0;height:1px;
    background:linear-gradient(90deg,transparent,var(--gold),transparent)}
  .revealed .rule{animation:grow 1.2s ease 1.2s forwards}
  @keyframes grow{to{width:82%}}

  .detail{margin:clamp(14px,3.6vw,20px) 0;animation-delay:1.3s}
  .detail .label{font-size:clamp(8px,2.3vw,10px);letter-spacing:5px;text-transform:uppercase;color:var(--blush);opacity:.9}
  .detail .value{font-family:var(--display);font-size:clamp(18px,4.8vw,22px);
    color:var(--pearl);margin-top:8px;line-height:1.45}

  .countdown{display:flex;justify-content:center;gap:clamp(5px,1.8vw,10px);
    margin:clamp(28px,6.5vw,38px) 0 clamp(6px,2vw,10px);animation-delay:1.55s}
  .cd-box{flex:1;max-width:70px;padding:clamp(11px,2.9vw,14px) 3px;border-radius:2px;
    background:rgba(203,167,90,.07);border:1px solid rgba(203,167,90,.25)}
  .cd-num{font-family:var(--display);font-size:clamp(21px,5.8vw,28px);color:var(--gold-l);line-height:1}
  .cd-lab{font-size:clamp(7px,2vw,9px);letter-spacing:2.5px;text-transform:uppercase;
    color:var(--gold-d);margin-top:8px}

  .footer{margin-top:clamp(24px,5.5vw,32px);font-family:var(--display);font-style:italic;
    font-size:clamp(14px,3.8vw,16px);color:var(--gold-l);
    animation-delay:1.75s;line-height:1.7;opacity:.85}
  @media (max-height:620px){.seal{width:80px;height:80px;margin-bottom:16px}.card{margin:18px auto}}
  @media (prefers-reduced-motion:reduce){*{animation-duration:.01ms !important;animation-iteration-count:1 !important}}
</style>
</head>
<body>
<div class="spot"></div>
<div class="dust" id="dust"></div>

<div class="gate" id="gate">
  <div class="curtain left"></div>
  <div class="curtain right"></div>
  <div class="rod"></div>
  <div class="gate-center">
    <div class="seal"><span id="monogram">A&amp;R</span></div>
    <div class="tap-hint">Açmaq üçün toxunun<small>↔</small></div>
  </div>
</div>

<main class="card" id="card">
  <div class="eyebrow reveal" id="topText">Dəvətlisiniz</div>
  <div class="wreath reveal"></div>
  <h1 class="names">
    <div class="name reveal" id="name1">Aynur</div>
    <span class="amp reveal">&amp;</span>
    <div class="name reveal amp2" id="name2">Rəşad</div>
  </h1>
  <div class="sub reveal" id="subText">bir olmağımızın toy şənliyinə</div>
  <div class="rule"></div>
  <div class="detail reveal"><div class="label">Tarix</div><div class="value" id="dateText">12 Sentyabr 2026 · Şənbə · 18:00</div></div>
  <div class="detail reveal"><div class="label">Məkan</div><div class="value" id="venueText">Gül Palace Şadlıq Sarayı, Bakı</div></div>
  <div class="countdown" id="countdown"></div>
  <div class="footer reveal" id="footerText">Bu xüsusi günü bizimlə bölüşməyinizi arzu edirik</div>
</main>

<script>
/* ===== BURANI DƏYİŞ ===== */
const MELUMAT = {
  monoqram:"A&R", ad1:"Aynur", ad2:"Rəşad",
  ustYazi:"Dəvətlisiniz",
  altYazi:"bir olmağımızın toy şənliyinə",
  tarixYazi:"12 Sentyabr 2026 · Şənbə · 18:00",
  mekan:"Gül Palace Şadlıq Sarayı, Bakı",
  sonYazi:"Bu xüsusi günü bizimlə bölüşməyinizi arzu edirik",
  toyTarixi:"2026-09-12T18:00:00"
};
/* ===== BURANI DƏYİŞ ===== */

const $=id=>document.getElementById(id);
$("monogram").textContent=MELUMAT.monoqram; $("name1").textContent=MELUMAT.ad1;
$("name2").textContent=MELUMAT.ad2; $("topText").textContent=MELUMAT.ustYazi;
$("subText").textContent=MELUMAT.altYazi; $("dateText").textContent=MELUMAT.tarixYazi;
$("venueText").textContent=MELUMAT.mekan; $("footerText").textContent=MELUMAT.sonYazi;
document.title=MELUMAT.ad1+" & "+MELUMAT.ad2+" — Toy Dəvətnaməsi";

const small=window.innerWidth<600, dw=$("dust");
for(let i=0;i<(small?14:26);i++){
  const d=document.createElement("i");
  const s=1.2+Math.random()*2.6;
  d.style.width=s+"px";d.style.height=s+"px";
  d.style.left=Math.random()*100+"vw";d.style.bottom="-20px";
  d.style.animationDuration=(14+Math.random()*13)+"s";
  d.style.animationDelay=(Math.random()*15)+"s";
  dw.appendChild(d);
}

const gate=$("gate"),card=$("card");
document.body.classList.add("locked");
let opened=false;
function openGate(e){if(opened)return;if(e)e.preventDefault();opened=true;
  gate.classList.add("open");card.classList.add("revealed");
  setTimeout(()=>{gate.classList.add("gone");document.body.classList.remove("locked")},2300);}
gate.addEventListener("pointerdown",openGate);
gate.addEventListener("click",openGate);
gate.addEventListener("touchstart",openGate,{passive:false});

const wd=new Date(MELUMAT.toyTarixi),lb=["Gün","Saat","Dəq","San"],cd=$("countdown");
function r(){const d=wd-new Date();let v=[0,0,0,0];
  if(d>0)v=[Math.floor(d/864e5),Math.floor(d/36e5)%24,Math.floor(d/6e4)%60,Math.floor(d/1e3)%60];
  cd.innerHTML=v.map((x,i)=>`<div class="cd-box"><div class="cd-num">${String(x).padStart(2,"0")}</div><div class="cd-lab">${lb[i]}</div></div>`).join("");}
r();setInterval(r,1000);
</script>
</body>
</html>
