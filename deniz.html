<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#0a3d54">
<title>Toy Dəvətnaməsi — Dəniz</title>
<meta property="og:title" content="Toy Dəvətnaməsi">
<meta property="og:description" content="Toy şənliyimizə dəvətlisiniz — açmaq üçün toxunun">
<style>
  :root{
    --deep:#062c3f; --mid:#0e5875; --foam:#bff0e8;
    --coral:#ff9d7d; --cream:#fdfaf4; --ink:#eef8f9;
    --wood:#f7f3ea; --wood2:#e6ddcc; --rope:#c9a877;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overflow-x:hidden}
  body{
    font-family:"Georgia","Times New Roman",serif;
    background:linear-gradient(180deg,#0b2c48 0%,#1d5a7a 24%,#6aa8b2 42%,#f2ab7c 52%,#1b7e9c 55%,#062c3f 100%);
    background-attachment:fixed;
    color:var(--ink);min-height:100vh;min-height:100dvh;
    display:flex;align-items:center;justify-content:center;position:relative;
    -webkit-text-size-adjust:100%;
  }
  body.locked{overflow:hidden;position:fixed;width:100%}
  .scene{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}

  .sun{position:absolute;left:50%;top:40%;transform:translate(-50%,-50%);
    width:clamp(70px,18vw,120px);height:clamp(70px,18vw,120px);border-radius:50%;
    background:radial-gradient(circle at 50% 45%,#fff6d4,#ffd08a 55%,#ff9d6b);
    box-shadow:0 0 70px 24px rgba(255,190,130,.5),0 0 160px 60px rgba(255,160,110,.25);
    animation:sunbreathe 6s ease-in-out infinite}
  @keyframes sunbreathe{0%,100%{transform:translate(-50%,-50%) scale(1)}50%{transform:translate(-50%,-50%) scale(1.05)}}

  .glint{position:absolute;left:50%;top:55%;transform:translateX(-50%);
    width:clamp(90px,26vw,190px);height:36vh;
    background:linear-gradient(180deg,rgba(255,205,150,.5),rgba(255,180,120,.1) 60%,transparent);
    filter:blur(7px);animation:glintwob 4s ease-in-out infinite}
  @keyframes glintwob{0%,100%{transform:translateX(-50%) scaleX(1);opacity:.8}50%{transform:translateX(-52%) scaleX(1.35);opacity:1}}

  .gull{position:absolute;font-size:clamp(12px,3.2vw,18px);color:rgba(255,255,255,.9);
    text-shadow:0 1px 3px rgba(0,0,0,.25);animation:glide linear infinite}
  .gull i{display:inline-block;font-style:normal;animation:flap 1.1s ease-in-out infinite}
  @keyframes flap{0%,100%{transform:scaleY(1)}50%{transform:scaleY(.4)}}
  @keyframes glide{
    0%{transform:translate3d(-14vw,0,0);opacity:0}
    8%{opacity:1}88%{opacity:1}
    100%{transform:translate3d(114vw,-7vh,0);opacity:0}
  }

  .boat{position:absolute;top:49%;left:-14vw;width:clamp(34px,9vw,58px);animation:sail 36s linear infinite}
  .boat .inner{animation:bob 3.2s ease-in-out infinite;transform-origin:50% 100%}
  @keyframes sail{0%{left:-14vw;opacity:0}6%{opacity:.95}92%{opacity:.95}100%{left:110vw;opacity:0}}
  @keyframes bob{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-6px) rotate(3deg)}}

  /* DALĞA QATLARI */
  .sea{position:absolute;left:0;bottom:0;width:100%;height:48vh}
  .wavelayer{position:absolute;bottom:0;left:0;width:200%;height:100%;display:flex}
  .wavelayer svg{display:block;width:50%;height:100%;flex:0 0 50%}
  .l1{animation:drift 9s linear infinite;opacity:.5}
  .l2{animation:drift 14s linear infinite reverse;opacity:.55;height:88%}
  .l3{animation:drift 20s linear infinite;opacity:.7;height:70%}
  .l4{animation:drift 28s linear infinite reverse;opacity:.95;height:50%}
  @keyframes drift{from{transform:translate3d(0,0,0)}to{transform:translate3d(-50%,0,0)}}
  .foamline{position:absolute;bottom:0;left:0;width:100%;height:11vh;
    background:radial-gradient(ellipse at 50% 100%,rgba(191,240,232,.5),transparent 70%);
    animation:foamp 5s ease-in-out infinite}
  @keyframes foamp{0%,100%{opacity:.45}50%{opacity:.9}}

  .floaters{position:absolute;inset:0;overflow:hidden}
  .fl{position:absolute;bottom:-40px;opacity:0;animation:riseup linear infinite;will-change:transform}
  @keyframes riseup{
    0%{transform:translate3d(0,0,0) rotate(0);opacity:0}
    12%{opacity:.8}80%{opacity:.8}
    100%{transform:translate3d(26px,-108vh,0) rotate(220deg);opacity:0}
  }

  /* QAPI */
  .gate{position:fixed;inset:0;z-index:20;display:flex;perspective:1400px;cursor:pointer;overflow:hidden;touch-action:manipulation}
  .gate.open{pointer-events:none}
  .gate.gone{display:none}
  .door{position:relative;width:50.2%;height:100%;
    background:linear-gradient(180deg,var(--wood),var(--wood2));
    box-shadow:inset 0 0 90px rgba(10,60,84,.25);
    transition:transform 2s cubic-bezier(.6,0,.2,1);
    transform-style:preserve-3d;backface-visibility:hidden;will-change:transform}
  .door.left{transform-origin:left center;border-right:2px solid rgba(10,60,84,.18)}
  .door.right{transform-origin:right center;border-left:2px solid rgba(10,60,84,.18)}
  .gate.open .door.left{transform:rotateY(-104deg)}
  .gate.open .door.right{transform:rotateY(104deg)}
  .slats{position:absolute;inset:clamp(14px,4vw,26px);border:clamp(5px,1.6vw,9px) solid var(--wood);
    border-radius:4px;overflow:hidden;
    box-shadow:0 0 0 2px rgba(10,60,84,.18), inset 0 0 0 2px rgba(10,60,84,.12);
    background:repeating-linear-gradient(180deg,#ffffff 0 clamp(10px,2.6vw,16px),
      #dde6e2 clamp(10px,2.6vw,16px) calc(clamp(10px,2.6vw,16px) + 4px))}
  .handle{position:absolute;top:50%;transform:translateY(-50%);
    width:clamp(15px,3.4vw,21px);height:clamp(38px,9vw,54px);border-radius:50%;
    border:clamp(4px,1.1vw,6px) solid var(--rope);box-shadow:0 2px 7px rgba(0,0,0,.22)}
  .door.left .handle{right:clamp(10px,3vw,20px)}
  .door.right .handle{left:clamp(10px,3vw,20px)}

  .gate-center{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
    z-index:2;text-align:center;pointer-events:none;width:90%;transition:opacity .5s ease}
  .gate.open .gate-center{opacity:0}
  .monogram{width:clamp(88px,26vw,120px);height:clamp(88px,26vw,120px);margin:0 auto clamp(16px,4vw,22px);
    border-radius:50%;display:flex;align-items:center;justify-content:center;
    border:3px solid var(--mid);color:var(--mid);font-size:clamp(28px,8vw,42px);letter-spacing:2px;
    background:rgba(255,255,255,.82);box-shadow:0 6px 24px rgba(10,60,84,.3);
    animation:mbob 3.4s ease-in-out infinite}
  @keyframes mbob{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
  .tap-hint{font-size:clamp(11px,3.2vw,14px);letter-spacing:3px;text-transform:uppercase;color:var(--mid);font-weight:bold}
  .tap-hint small{display:block;margin-top:8px;font-size:clamp(22px,6vw,26px);animation:tapper 1.6s ease-in-out infinite}
  @keyframes tapper{0%,100%{transform:translateY(0);opacity:.6}50%{transform:translateY(-8px);opacity:1}}

  /* KART */
  .card{position:relative;z-index:5;width:min(92vw,560px);
    margin:clamp(20px,6vw,40px) auto;
    padding:clamp(34px,9vw,56px) clamp(20px,6vw,34px) clamp(30px,8vw,46px);
    text-align:center;
    background:linear-gradient(165deg,rgba(6,44,63,.55),rgba(14,88,117,.4));
    border:1px solid rgba(191,240,232,.4);border-radius:20px;
    box-shadow:0 24px 70px rgba(3,30,44,.55), inset 0 0 60px rgba(191,240,232,.08);
    backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);overflow:hidden}
  .card::before{content:"";position:absolute;top:0;left:-60%;width:60%;height:100%;
    background:linear-gradient(90deg,transparent,rgba(255,255,255,.16),transparent)}
  .revealed.card::before{animation:shine 6s ease-in-out 1s infinite}
  @keyframes shine{0%{left:-60%}45%,100%{left:130%}}
  .reveal{opacity:0;transform:translateY(22px)}
  .revealed .reveal{animation:up .9s ease forwards}
  @keyframes up{to{opacity:1;transform:translateY(0)}}
  .top{font-size:clamp(11px,3vw,13px);letter-spacing:4px;text-transform:uppercase;color:var(--foam);animation-delay:.2s}
  .ornament{font-size:clamp(24px,6.5vw,30px);margin:14px 0 6px;animation-delay:.4s}
  .ornament span{display:inline-block;animation:sway 3.6s ease-in-out infinite}
  .names{font-size:clamp(30px,10vw,54px);line-height:1.15;color:var(--cream);margin:10px 0;font-weight:normal;
    text-shadow:0 2px 24px rgba(191,240,232,.45);overflow-wrap:break-word}
  .name{animation-delay:.6s}
  .amp{display:block;font-size:clamp(22px,6vw,28px);color:var(--coral);margin:4px 0;animation-delay:.75s;font-style:italic}
  .amp2{animation-delay:.9s}
  .sub{font-size:clamp(13px,3.6vw,15px);letter-spacing:1.5px;color:var(--foam);margin-top:14px;animation-delay:1s}
  .divider{width:0;height:1px;background:linear-gradient(90deg,transparent,var(--foam),transparent);margin:clamp(20px,5vw,26px) auto}
  .revealed .divider{animation:grow 1.1s ease 1.1s forwards}
  @keyframes grow{to{width:78%}}
  .detail{margin:14px 0;animation-delay:1.25s}
  .detail .label{font-size:clamp(10px,2.8vw,11px);letter-spacing:2.5px;text-transform:uppercase;color:var(--coral)}
  .detail .value{font-size:clamp(16px,4.4vw,19px);color:var(--ink);margin-top:5px;line-height:1.45}
  .countdown{display:flex;justify-content:center;gap:clamp(7px,2.4vw,14px);margin:clamp(22px,6vw,30px) 0 10px;animation-delay:1.5s}
  .cd-box{flex:1;max-width:74px;padding:clamp(9px,2.6vw,12px) 4px;border-radius:11px;
    background:rgba(255,255,255,.12);border:1px solid rgba(191,240,232,.35)}
  .cd-num{font-size:clamp(19px,5.6vw,26px);color:var(--cream);line-height:1}
  .cd-lab{font-size:clamp(8px,2.3vw,10px);letter-spacing:1px;text-transform:uppercase;color:var(--foam);margin-top:6px}
  .footer{margin-top:clamp(20px,5vw,26px);font-size:clamp(12px,3.3vw,13px);color:var(--foam);
    animation-delay:1.7s;font-style:italic;line-height:1.6}
  .rings{font-size:clamp(26px,7vw,30px);margin-top:8px;animation-delay:1.8s}
  .rings span{display:inline-block;animation:sway 3s ease-in-out infinite}
  @keyframes sway{0%,100%{transform:rotate(-9deg)}50%{transform:rotate(9deg)}}
  @media (max-height:600px){.monogram{width:72px;height:72px;font-size:24px;margin-bottom:12px}.card{margin:16px auto}}
</style>
</head>
<body>
<div class="scene">
  <div class="sun"></div>
  <div class="glint"></div>
  <div id="gulls"></div>

  <div class="boat"><div class="inner">
    <svg viewBox="0 0 100 90" xmlns="http://www.w3.org/2000/svg">
      <path d="M50 4 L50 62" stroke="#2b1f16" stroke-width="3"/>
      <path d="M52 8 L86 58 L52 58 Z" fill="#fdfaf4" opacity=".95"/>
      <path d="M46 20 L20 58 L46 58 Z" fill="#ffd8c2" opacity=".95"/>
      <path d="M12 60 L88 60 L74 78 L26 78 Z" fill="#8a5a3b"/>
    </svg>
  </div></div>

  <div class="sea">
    <div class="wavelayer l1">
      <svg viewBox="0 0 600 200" preserveAspectRatio="none"><path d="M0,90 C90,40 190,140 300,90 C410,40 510,140 600,90 L600,200 L0,200 Z" fill="#4bbcc9"/></svg>
      <svg viewBox="0 0 600 200" preserveAspectRatio="none"><path d="M0,90 C90,40 190,140 300,90 C410,40 510,140 600,90 L600,200 L0,200 Z" fill="#4bbcc9"/></svg>
    </div>
    <div class="wavelayer l2">
      <svg viewBox="0 0 600 200" preserveAspectRatio="none"><path d="M0,100 C80,60 200,150 300,100 C400,50 520,150 600,100 L600,200 L0,200 Z" fill="#2a9fb5"/></svg>
      <svg viewBox="0 0 600 200" preserveAspectRatio="none"><path d="M0,100 C80,60 200,150 300,100 C400,50 520,150 600,100 L600,200 L0,200 Z" fill="#2a9fb5"/></svg>
    </div>
    <div class="wavelayer l3">
      <svg viewBox="0 0 600 200" preserveAspectRatio="none"><path d="M0,95 C100,145 180,45 300,95 C420,145 500,45 600,95 L600,200 L0,200 Z" fill="#136f92"/></svg>
      <svg viewBox="0 0 600 200" preserveAspectRatio="none"><path d="M0,95 C100,145 180,45 300,95 C420,145 500,45 600,95 L600,200 L0,200 Z" fill="#136f92"/></svg>
    </div>
    <div class="wavelayer l4">
      <svg viewBox="0 0 600 200" preserveAspectRatio="none"><path d="M0,105 C110,55 190,155 300,105 C410,55 490,155 600,105 L600,200 L0,200 Z" fill="#062c3f"/></svg>
      <svg viewBox="0 0 600 200" preserveAspectRatio="none"><path d="M0,105 C110,55 190,155 300,105 C410,55 490,155 600,105 L600,200 L0,200 Z" fill="#062c3f"/></svg>
    </div>
    <div class="foamline"></div>
  </div>

  <div class="floaters" id="floaters"></div>
</div>

<div class="gate" id="gate">
  <div class="door left"><div class="slats"></div><div class="handle"></div></div>
  <div class="door right"><div class="slats"></div><div class="handle"></div></div>
  <div class="gate-center">
    <div class="monogram" id="monogram">A&amp;R</div>
    <div class="tap-hint">Açmaq üçün toxunun<small>👆</small></div>
  </div>
</div>

<main class="card" id="card">
  <div class="top reveal" id="topText">Dəvətlisiniz</div>
  <div class="ornament reveal"><span>🐚</span></div>
  <h1 class="names">
    <div class="name reveal" id="name1">Aynur</div>
    <span class="amp reveal">&amp;</span>
    <div class="name reveal amp2" id="name2">Rəşad</div>
  </h1>
  <div class="sub reveal" id="subText">bir olmağımızın toy şənliyinə</div>
  <div class="divider"></div>
  <div class="detail reveal"><div class="label">Tarix</div><div class="value" id="dateText">12 Sentyabr 2026 · Şənbə · saat 18:00</div></div>
  <div class="detail reveal"><div class="label">Məkan</div><div class="value" id="venueText">Gül Palace Şadlıq Sarayı, Bakı</div></div>
  <div class="countdown" id="countdown"></div>
  <div class="footer reveal" id="footerText">Bu xüsusi günü bizimlə bölüşməyinizi arzu edirik</div>
  <div class="rings reveal"><span>💍</span></div>
</main>

<script>
/* ===== BURANI DƏYİŞ ===== */
const MELUMAT = {
  monoqram:"A&R", ad1:"Aynur", ad2:"Rəşad",
  ustYazi:"Dəvətlisiniz",
  altYazi:"bir olmağımızın toy şənliyinə",
  tarixYazi:"12 Sentyabr 2026 · Şənbə · saat 18:00",
  mekan:"Gül Palace Şadlıq Sarayı, Bakı",
  sonYazi:"Bu xüsusi günü bizimlə bölüşməyinizi arzu edirik",
  toyTarixi:"2026-09-12T18:00:00"
};
/* ===== BURANI DƏYİŞ ===== */

const $=id=>document.getElementById(id);
$("monogram").textContent=MELUMAT.monoqram; $("name1").textContent=MELUMAT.ad1;
$("name2").textContent=MELUMAT.ad2; $("topText").textContent=MELUMAT.ustYazi;
$("subText").textContent=MELUMAT.altYazi; $("dateText").textContent=MELUMAT.tarixYazi;
$("venueText").textContent=MELUMAT.mekan; $("footerText").textContent=MELUMAT.sonYazi;
document.title=MELUMAT.ad1+" & "+MELUMAT.ad2+" — Toy Dəvətnaməsi";

const small=window.innerWidth<600;

const gw=$("gulls");
for(let i=0;i<(small?3:5);i++){
  const g=document.createElement("div");g.className="gull";
  g.innerHTML="<i>\u1B5C</i>";
  g.style.top=(7+Math.random()*25)+"vh";
  g.style.animationDuration=(22+Math.random()*18)+"s";
  g.style.animationDelay=(Math.random()*20)+"s";
  gw.appendChild(g);
}
const chars=["🫧","🐚","✦","🐠"], fw=$("floaters");
for(let i=0;i<(small?10:18);i++){
  const p=document.createElement("div");p.className="fl";
  p.textContent=chars[i%chars.length];
  p.style.left=Math.random()*100+"vw";
  p.style.animationDuration=(11+Math.random()*10)+"s";
  p.style.animationDelay=(Math.random()*11)+"s";
  p.style.fontSize=((small?10:13)+Math.random()*(small?9:13))+"px";
  fw.appendChild(p);
}

const gate=$("gate"),card=$("card");
document.body.classList.add("locked");
let opened=false;
function openGate(e){if(opened)return;if(e)e.preventDefault();opened=true;
  gate.classList.add("open");card.classList.add("revealed");
  setTimeout(()=>{gate.classList.add("gone");document.body.classList.remove("locked")},2100);}
gate.addEventListener("pointerdown",openGate);
gate.addEventListener("click",openGate);
gate.addEventListener("touchstart",openGate,{passive:false});

const wd=new Date(MELUMAT.toyTarixi),lb=["Gün","Saat","Dəq","San"],cd=$("countdown");
function r(){const d=wd-new Date();let v=[0,0,0,0];
  if(d>0)v=[Math.floor(d/864e5),Math.floor(d/36e5)%24,Math.floor(d/6e4)%60,Math.floor(d/1e3)%60];
  cd.innerHTML=v.map((x,i)=>`<div class="cd-box"><div class="cd-num">${String(x).padStart(2,"0")}</div><div class="cd-lab">${lb[i]}</div></div>`).join("");}
r();setInterval(r,1000);
</script>
</body>
</html>
