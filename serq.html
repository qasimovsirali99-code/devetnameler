<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#0d4048">
<title>Toy Dəvətnaməsi — Şərq Naxışı</title>
<meta property="og:title" content="Toy Dəvətnaməsi">
<meta property="og:description" content="Toy şənliyimizə dəvətlisiniz">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300&family=Jost:wght@300;400;500&display=swap&subset=latin-ext" rel="stylesheet">
<style>
  :root{
    --petrol:#0d4048; --petrol-d:#07272d; --petrol-l:#166b74;
    --terra:#c0563a; --gold:#d9a441; --gold-l:#f0cd85;
    --ivory:#f6eeda; --plum:#4a2340;
    --serif:"Cormorant Garamond",Georgia,serif;
    --sans:"Jost","Segoe UI",sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overflow-x:hidden}
  body{
    font-family:var(--serif);
    background:
      radial-gradient(ellipse at 50% 0%, #17646d 0%, #0d4048 42%, #07272d 100%);
    background-attachment:fixed;
    color:var(--ivory);min-height:100vh;min-height:100dvh;
    display:flex;align-items:center;justify-content:center;position:relative;
    -webkit-text-size-adjust:100%;
  }
  body.locked{overflow:hidden;position:fixed;width:100%}

  /* xalça naxışı fonu */
  .scene{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;opacity:.16}
  .scene .tile{position:absolute;inset:-10%;
    background-image:
      radial-gradient(circle at 50% 50%, transparent 46%, var(--gold) 46.5%, transparent 48%),
      repeating-conic-gradient(from 22.5deg at 50% 50%, var(--gold-l) 0 6deg, transparent 6deg 45deg);
    background-size:clamp(90px,22vw,150px) clamp(90px,22vw,150px);
    animation:tiledrift 90s linear infinite}
  @keyframes tiledrift{to{transform:translate(clamp(90px,22vw,150px),clamp(90px,22vw,150px))}}

  /* qızıl zərrələr */
  .dust{position:fixed;inset:0;z-index:1;pointer-events:none;overflow:hidden}
  .dust i{position:absolute;font-style:normal;color:var(--gold-l);opacity:0;
    animation:driftup linear infinite}
  @keyframes driftup{
    0%{transform:translate3d(0,20px,0) rotate(0);opacity:0}
    15%{opacity:.7}80%{opacity:.7}
    100%{transform:translate3d(30px,-105vh,0) rotate(300deg);opacity:0}
  }

  /* ===== TAĞLI QAPI ===== */
  .gate{position:fixed;inset:0;z-index:20;display:flex;perspective:1500px;cursor:pointer;overflow:hidden;touch-action:manipulation}
  .gate.open{pointer-events:none}
  .gate.gone{display:none}
  .door{position:relative;width:50.2%;height:100%;
    background:
      linear-gradient(180deg,#0f4f58,#07272d);
    transition:transform 2.1s cubic-bezier(.62,0,.2,1);
    transform-style:preserve-3d;backface-visibility:hidden;will-change:transform;overflow:hidden}
  .door.left{transform-origin:left center}
  .door.right{transform-origin:right center}
  .gate.open .door.left{transform:rotateY(-106deg)}
  .gate.open .door.right{transform:rotateY(106deg)}

  /* tağ forması */
  .arch{position:absolute;top:clamp(20px,5vw,40px);bottom:clamp(20px,5vw,40px);
    left:clamp(16px,4vw,30px);right:clamp(16px,4vw,30px);
    border:clamp(3px,.9vw,5px) solid var(--gold);
    border-radius:50% 50% 6px 6px / 32% 32% 2% 2%;
    box-shadow:0 0 0 1px rgba(217,164,65,.3), inset 0 0 60px rgba(217,164,65,.1);
    overflow:hidden}
  .door.left .arch{border-right:none;border-radius:50% 0 0 6px / 32% 0 0 2%}
  .door.right .arch{border-left:none;border-radius:0 50% 6px 0 / 0 32% 2% 0}
  /* səkkizguşəli ulduz şəbəkəsi */
  .arch::before{content:"";position:absolute;inset:0;opacity:.5;
    background-image:
      repeating-conic-gradient(from 22.5deg at 50% 50%, rgba(217,164,65,.65) 0 3deg, transparent 3deg 45deg),
      radial-gradient(circle at 50% 50%, transparent 40%, rgba(217,164,65,.4) 41%, transparent 43%);
    background-size:clamp(52px,13vw,84px) clamp(52px,13vw,84px)}
  /* tağın altındakı terrakota zolaq */
  .arch::after{content:"";position:absolute;left:0;right:0;bottom:0;height:clamp(26px,7vw,44px);
    background:repeating-linear-gradient(90deg,var(--terra) 0 clamp(11px,3vw,18px),
      var(--gold) clamp(11px,3vw,18px) calc(clamp(11px,3vw,18px) + 3px));
    opacity:.75}

  .handle{position:absolute;top:50%;transform:translateY(-50%);
    width:clamp(16px,3.6vw,22px);height:clamp(16px,3.6vw,22px);border-radius:50%;
    background:radial-gradient(circle at 35% 35%,var(--gold-l),var(--gold) 60%,#8a6420);
    box-shadow:0 0 18px rgba(217,164,65,.65), 0 3px 8px rgba(0,0,0,.4)}
  .handle::after{content:"";position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
    width:clamp(30px,7vw,44px);height:clamp(30px,7vw,44px);border-radius:50%;
    border:2px solid rgba(217,164,65,.5)}
  .door.left .handle{right:clamp(28px,7vw,50px)}
  .door.right .handle{left:clamp(28px,7vw,50px)}

  .gate-center{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
    z-index:2;text-align:center;pointer-events:none;width:90%;transition:opacity .55s ease}
  .gate.open .gate-center{opacity:0}
  .star{width:clamp(96px,28vw,132px);height:clamp(96px,28vw,132px);margin:0 auto clamp(18px,4vw,24px);
    position:relative;display:flex;align-items:center;justify-content:center}
  .star::before,.star::after{content:"";position:absolute;inset:0;
    border:2px solid var(--gold);background:rgba(13,64,72,.7)}
  .star::after{transform:rotate(45deg)}
  .star span{position:relative;z-index:2;font-family:var(--serif);
    font-size:clamp(26px,7.6vw,38px);color:var(--gold-l);letter-spacing:1px;
    text-shadow:0 2px 14px rgba(217,164,65,.5)}
  .tap-hint{font-family:var(--sans);font-weight:300;font-size:clamp(10px,2.9vw,12px);
    letter-spacing:5px;text-transform:uppercase;color:var(--gold)}
  .tap-hint small{display:block;margin-top:10px;font-size:clamp(20px,5.5vw,24px);
    animation:tapper 1.7s ease-in-out infinite}
  @keyframes tapper{0%,100%{transform:translateY(0);opacity:.55}50%{transform:translateY(-8px);opacity:1}}

  /* ===== KART: tağ formasında ===== */
  .card{position:relative;z-index:5;width:min(90vw,520px);
    margin:clamp(24px,7vw,48px) auto;
    padding:clamp(52px,13vw,84px) clamp(24px,7vw,42px) clamp(34px,9vw,52px);
    text-align:center;
    background:linear-gradient(175deg,rgba(7,39,45,.9),rgba(13,64,72,.82));
    border:1px solid rgba(217,164,65,.45);
    border-radius:50% 50% 18px 18px / 20% 20% 3% 3%;
    box-shadow:0 30px 80px rgba(0,0,0,.55), inset 0 0 80px rgba(217,164,65,.06);
    backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);overflow:hidden}
  /* daxili qızıl haşiyə */
  .card::after{content:"";position:absolute;inset:clamp(10px,2.6vw,16px);
    border:1px solid rgba(217,164,65,.28);pointer-events:none;
    border-radius:50% 50% 12px 12px / 20% 20% 2% 2%}

  .reveal{opacity:0;transform:translateY(20px)}
  .revealed .reveal{animation:up 1s cubic-bezier(.2,.7,.3,1) forwards}
  @keyframes up{to{opacity:1;transform:translateY(0)}}

  .eyebrow{font-family:var(--sans);font-weight:300;font-size:clamp(9px,2.6vw,11px);
    letter-spacing:6px;text-transform:uppercase;color:var(--gold);animation-delay:.25s}
  .motif{margin:clamp(14px,3.5vw,20px) auto;width:clamp(34px,9vw,46px);height:clamp(34px,9vw,46px);
    position:relative;animation-delay:.4s}
  .motif::before,.motif::after{content:"";position:absolute;inset:0;border:1.5px solid var(--gold);
    animation:slowspin 24s linear infinite}
  .motif::after{transform:rotate(45deg)}
  @keyframes slowspin{to{transform:rotate(360deg)}}
  .motif::after{animation-direction:reverse}

  .names{font-family:var(--serif);font-weight:300;
    font-size:clamp(34px,11vw,58px);line-height:1.08;color:var(--ivory);
    margin:clamp(6px,2vw,10px) 0;overflow-wrap:break-word;letter-spacing:.5px}
  .name{animation-delay:.6s}
  .amp{display:block;font-size:clamp(20px,5.5vw,26px);color:var(--terra);
    margin:clamp(4px,1.4vw,8px) 0;animation-delay:.75s;font-style:italic;font-weight:300}
  .amp2{animation-delay:.9s}

  .sub{font-family:var(--serif);font-style:italic;font-weight:300;
    font-size:clamp(15px,4.2vw,19px);color:var(--gold-l);margin-top:clamp(10px,3vw,16px);
    animation-delay:1.05s;line-height:1.5}

  .rule{margin:clamp(24px,6vw,34px) auto;width:0;height:1px;
    background:linear-gradient(90deg,transparent,var(--gold),transparent)}
  .revealed .rule{animation:grow 1.2s ease 1.2s forwards}
  @keyframes grow{to{width:82%}}

  .detail{margin:clamp(14px,3.6vw,20px) 0;animation-delay:1.3s}
  .detail .label{font-family:var(--sans);font-weight:300;font-size:clamp(9px,2.5vw,10px);
    letter-spacing:4px;text-transform:uppercase;color:var(--terra)}
  .detail .value{font-size:clamp(17px,4.8vw,21px);color:var(--ivory);margin-top:6px;line-height:1.45}

  .countdown{display:flex;justify-content:center;gap:clamp(6px,2.2vw,12px);
    margin:clamp(26px,6.5vw,36px) 0 clamp(6px,2vw,10px);animation-delay:1.55s}
  .cd-box{flex:1;max-width:72px;padding:clamp(10px,2.8vw,13px) 4px;
    background:rgba(217,164,65,.07);border:1px solid rgba(217,164,65,.28)}
  .cd-num{font-family:var(--serif);font-size:clamp(20px,5.8vw,27px);color:var(--gold-l);line-height:1}
  .cd-lab{font-family:var(--sans);font-weight:300;font-size:clamp(7px,2.1vw,9px);
    letter-spacing:2px;text-transform:uppercase;color:var(--gold);margin-top:7px}

  .footer{margin-top:clamp(22px,5.5vw,30px);font-size:clamp(13px,3.6vw,15px);
    color:var(--gold-l);animation-delay:1.75s;font-style:italic;line-height:1.65;opacity:.9}
  @media (max-height:620px){.star{width:76px;height:76px;margin-bottom:14px}.card{margin:18px auto}}
  @media (prefers-reduced-motion:reduce){*{animation-duration:.01ms !important;animation-iteration-count:1 !important}}
</style>
</head>
<body>
<div class="scene"><div class="tile"></div></div>
<div class="dust" id="dust"></div>

<div class="gate" id="gate">
  <div class="door left"><div class="arch"></div><div class="handle"></div></div>
  <div class="door right"><div class="arch"></div><div class="handle"></div></div>
  <div class="gate-center">
    <div class="star"><span id="monogram">A&amp;R</span></div>
    <div class="tap-hint">Açmaq üçün toxunun<small>↔</small></div>
  </div>
</div>

<main class="card" id="card">
  <div class="eyebrow reveal" id="topText">Dəvətlisiniz</div>
  <div class="motif reveal"></div>
  <h1 class="names">
    <div class="name reveal" id="name1">Aynur</div>
    <span class="amp reveal">&amp;</span>
    <div class="name reveal amp2" id="name2">Rəşad</div>
  </h1>
  <div class="sub reveal" id="subText">bir olmağımızın toy şənliyinə</div>
  <div class="rule"></div>
  <div class="detail reveal"><div class="label">Tarix</div><div class="value" id="dateText">12 Sentyabr 2026 · Şənbə · 18:00</div></div>
  <div class="detail reveal"><div class="label">Məkan</div><div class="value" id="venueText">Gül Palace Şadlıq Sarayı, Bakı</div></div>
  <div class="countdown" id="countdown"></div>
  <div class="footer reveal" id="footerText">Bu xüsusi günü bizimlə bölüşməyinizi arzu edirik</div>
</main>

<script>
/* ===== BURANI DƏYİŞ ===== */
const MELUMAT = {
  monoqram:"A&R", ad1:"Aynur", ad2:"Rəşad",
  ustYazi:"Dəvətlisiniz",
  altYazi:"bir olmağımızın toy şənliyinə",
  tarixYazi:"12 Sentyabr 2026 · Şənbə · 18:00",
  mekan:"Gül Palace Şadlıq Sarayı, Bakı",
  sonYazi:"Bu xüsusi günü bizimlə bölüşməyinizi arzu edirik",
  toyTarixi:"2026-09-12T18:00:00"
};
/* ===== BURANI DƏYİŞ ===== */

const $=id=>document.getElementById(id);
$("monogram").textContent=MELUMAT.monoqram; $("name1").textContent=MELUMAT.ad1;
$("name2").textContent=MELUMAT.ad2; $("topText").textContent=MELUMAT.ustYazi;
$("subText").textContent=MELUMAT.altYazi; $("dateText").textContent=MELUMAT.tarixYazi;
$("venueText").textContent=MELUMAT.mekan; $("footerText").textContent=MELUMAT.sonYazi;
document.title=MELUMAT.ad1+" & "+MELUMAT.ad2+" — Toy Dəvətnaməsi";

const small=window.innerWidth<600, dw=$("dust");
for(let i=0;i<(small?12:20);i++){
  const d=document.createElement("i");
  d.textContent=["✦","✧","◆","·"][i%4];
  d.style.left=Math.random()*100+"vw";
  d.style.bottom="-30px";
  d.style.fontSize=((small?7:9)+Math.random()*(small?7:10))+"px";
  d.style.animationDuration=(13+Math.random()*12)+"s";
  d.style.animationDelay=(Math.random()*14)+"s";
  dw.appendChild(d);
}

const gate=$("gate"),card=$("card");
document.body.classList.add("locked");
let opened=false;
function openGate(e){if(opened)return;if(e)e.preventDefault();opened=true;
  gate.classList.add("open");card.classList.add("revealed");
  setTimeout(()=>{gate.classList.add("gone");document.body.classList.remove("locked")},2200);}
gate.addEventListener("pointerdown",openGate);
gate.addEventListener("click",openGate);
gate.addEventListener("touchstart",openGate,{passive:false});

const wd=new Date(MELUMAT.toyTarixi),lb=["Gün","Saat","Dəq","San"],cd=$("countdown");
function r(){const d=wd-new Date();let v=[0,0,0,0];
  if(d>0)v=[Math.floor(d/864e5),Math.floor(d/36e5)%24,Math.floor(d/6e4)%60,Math.floor(d/1e3)%60];
  cd.innerHTML=v.map((x,i)=>`<div class="cd-box"><div class="cd-num">${String(x).padStart(2,"0")}</div><div class="cd-lab">${lb[i]}</div></div>`).join("");}
r();setInterval(r,1000);
</script>
</body>
</html>
