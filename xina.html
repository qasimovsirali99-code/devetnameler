<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#4a0d1c">
<title>Xına Gecəsi Dəvətnaməsi</title>
<meta property="og:title" content="Xına Gecəsi">
<meta property="og:description" content="Xına gecəmizə dəvətlisiniz">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300&family=Jost:wght@200;300;400&display=swap&subset=latin-ext" rel="stylesheet">
<style>
  :root{
    --nar:#7d1128; --nar-d:#4a0d1c; --nar-l:#a8253f;
    --saffron:#d4a017; --saffron-l:#f2d488; --henna:#b5651d;
    --cream:#fbf0dc; --wood:#5c2a1e; --wood2:#3d1a12;
    --display:"Cormorant Garamond",Georgia,serif;
    --sans:"Jost","Segoe UI",sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overflow-x:hidden}
  body{
    font-family:var(--sans);font-weight:300;
    background:radial-gradient(ellipse at 50% 20%,#8d1b32 0%,#5c1020 45%,#33080f 100%);
    background-attachment:fixed;
    color:var(--cream);min-height:100vh;min-height:100dvh;
    display:flex;align-items:center;justify-content:center;position:relative;
    -webkit-text-size-adjust:100%;
  }
  body.locked{overflow:hidden;position:fixed;width:100%}

  /* xına naxışı fonu */
  .scene{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;opacity:.13}
  .scene .pattern{position:absolute;inset:-10%;
    background-image:
      radial-gradient(circle at 50% 50%, transparent 40%, var(--saffron) 41%, transparent 44%),
      radial-gradient(circle at 0% 0%, transparent 26%, var(--saffron-l) 27%, transparent 29%),
      radial-gradient(circle at 100% 100%, transparent 26%, var(--saffron-l) 27%, transparent 29%);
    background-size:clamp(80px,20vw,130px) clamp(80px,20vw,130px);
    animation:slowpan 100s linear infinite}
  @keyframes slowpan{to{transform:translate(clamp(80px,20vw,130px),clamp(80px,20vw,130px))}}

  /* ŞAMLAR — aşağıda titrəyən alovlar */
  .candles{position:fixed;bottom:0;left:0;width:100%;height:20vh;z-index:1;
    pointer-events:none;display:flex;align-items:flex-end;justify-content:center;
    gap:clamp(16px,5vw,40px)}
  .candle{position:relative;width:clamp(9px,2.4vw,14px);
    height:clamp(38px,10vw,64px);border-radius:3px 3px 0 0;
    background:linear-gradient(180deg,#fbf0dc,#e0c9a4)}
  .flame{position:absolute;left:50%;bottom:100%;transform:translateX(-50%);
    width:clamp(9px,2.4vw,13px);height:clamp(16px,4.2vw,24px);
    border-radius:50% 50% 50% 50% / 62% 62% 38% 38%;
    background:radial-gradient(circle at 50% 72%,#fff6cf,#f6c344 45%,#e0741c 78%);
    box-shadow:0 0 22px 8px rgba(244,180,60,.45);
    animation:flicker ease-in-out infinite}
  @keyframes flicker{
    0%,100%{transform:translateX(-50%) scaleY(1) scaleX(1);opacity:.94}
    25%{transform:translateX(-52%) scaleY(1.14) scaleX(.92);opacity:1}
    50%{transform:translateX(-48%) scaleY(.92) scaleX(1.06);opacity:.88}
    75%{transform:translateX(-51%) scaleY(1.08) scaleX(.96);opacity:1}
  }

  /* qığılcımlar */
  .sparks{position:fixed;inset:0;z-index:2;pointer-events:none;overflow:hidden}
  .sparks i{position:absolute;border-radius:50%;background:var(--saffron-l);opacity:0;
    animation:up-spark linear infinite}
  @keyframes up-spark{
    0%{transform:translate3d(0,0,0);opacity:0}
    15%{opacity:.85}70%{opacity:.5}
    100%{transform:translate3d(22px,-92vh,0);opacity:0}
  }

  /* ===== QAPI: oyma taxta + xına naxışı ===== */
  .gate{position:fixed;inset:0;z-index:20;display:flex;perspective:1500px;cursor:pointer;overflow:hidden;touch-action:manipulation}
  .gate.open{pointer-events:none}
  .gate.gone{display:none}
  .door{position:relative;width:50.2%;height:100%;
    background:
      repeating-linear-gradient(90deg, var(--wood) 0 32px, var(--wood2) 32px 35px),
      var(--wood);
    box-shadow:inset 0 0 100px rgba(0,0,0,.6);
    transition:transform 2.1s cubic-bezier(.62,0,.2,1);
    transform-style:preserve-3d;backface-visibility:hidden;will-change:transform;overflow:hidden}
  .door.left{transform-origin:left center}
  .door.right{transform-origin:right center}
  .gate.open .door.left{transform:rotateY(-106deg)}
  .gate.open .door.right{transform:rotateY(106deg)}

  .carve{position:absolute;inset:clamp(14px,4vw,26px);
    border:clamp(3px,.9vw,5px) solid var(--saffron);
    box-shadow:inset 0 0 40px rgba(212,160,23,.14);overflow:hidden}
  /* xına buta naxışı */
  .carve svg{position:absolute;width:100%;height:100%;opacity:.55}
  .carve .buta{fill:none;stroke:var(--saffron-l);stroke-width:1.6;stroke-linecap:round}
  .carve .dot{fill:var(--saffron)}

  .handle{position:absolute;top:50%;transform:translateY(-50%);
    width:clamp(18px,4vw,24px);height:clamp(18px,4vw,24px);border-radius:50%;
    background:radial-gradient(circle at 35% 35%,var(--saffron-l),var(--saffron) 55%,#8a6410);
    box-shadow:0 0 20px rgba(212,160,23,.6), 0 3px 9px rgba(0,0,0,.5)}
  .door.left .handle{right:clamp(30px,7.5vw,52px)}
  .door.right .handle{left:clamp(30px,7.5vw,52px)}

  .gate-center{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
    z-index:3;text-align:center;pointer-events:none;width:90%;transition:opacity .55s ease}
  .gate.open .gate-center{opacity:0}
  .plate{width:clamp(100px,28vw,136px);height:clamp(100px,28vw,136px);
    margin:0 auto clamp(20px,4.5vw,28px);border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    background:radial-gradient(circle at 38% 34%,#8d1b32,#4a0d1c 72%);
    border:2px solid var(--saffron);
    box-shadow:0 0 0 7px rgba(74,13,28,.8), 0 0 44px rgba(212,160,23,.4), 0 14px 40px rgba(0,0,0,.6)}
  .plate span{font-family:var(--display);font-weight:400;
    font-size:clamp(27px,7.6vw,37px);color:var(--saffron-l);letter-spacing:1px}
  .tap-hint{font-size:clamp(9px,2.7vw,11px);letter-spacing:6px;text-transform:uppercase;color:var(--saffron)}
  .tap-hint small{display:block;margin-top:12px;font-size:clamp(18px,5vw,22px);letter-spacing:0;
    animation:tapper 1.7s ease-in-out infinite}
  @keyframes tapper{0%,100%{transform:translateY(0);opacity:.5}50%{transform:translateY(-8px);opacity:1}}

  /* ===== KART ===== */
  .card{position:relative;z-index:5;width:min(90vw,530px);
    margin:clamp(24px,7vw,48px) auto clamp(90px,20vw,140px);
    padding:clamp(42px,10vw,64px) clamp(26px,7vw,46px) clamp(34px,8vw,50px);
    text-align:center;
    background:linear-gradient(172deg,rgba(125,17,40,.93),rgba(58,10,20,.95));
    border:1px solid rgba(212,160,23,.5);border-radius:3px;
    box-shadow:0 30px 84px rgba(0,0,0,.6), inset 0 0 80px rgba(212,160,23,.06);
    overflow:hidden}
  .card::before{content:"";position:absolute;inset:clamp(9px,2.4vw,14px);
    border:1px solid rgba(212,160,23,.28);pointer-events:none}

  .reveal{opacity:0;transform:translateY(18px)}
  .revealed .reveal{animation:up 1s cubic-bezier(.2,.7,.3,1) forwards}
  @keyframes up{to{opacity:1;transform:translateY(0)}}

  /* nar motivi */
  .nar{width:clamp(44px,11vw,58px);margin:0 auto clamp(14px,3.6vw,20px);animation-delay:.3s}
  .nar path{fill:none;stroke:var(--saffron);stroke-width:2;stroke-linecap:round;
    stroke-dasharray:220;stroke-dashoffset:220}
  .revealed .nar path{animation:draw 1.8s ease .7s forwards}
  @keyframes draw{to{stroke-dashoffset:0}}
  .nar circle{fill:var(--nar-l);opacity:0}
  .revealed .nar circle{animation:seedin .7s ease 2.2s forwards}
  @keyframes seedin{to{opacity:.9}}

  .eyebrow{font-size:clamp(9px,2.6vw,11px);letter-spacing:7px;text-transform:uppercase;
    color:var(--saffron);animation-delay:.5s}

  .names{font-family:var(--display);font-weight:300;
    font-size:clamp(34px,11vw,56px);line-height:1.08;color:var(--cream);
    margin:clamp(16px,4.5vw,26px) 0 0;overflow-wrap:break-word}
  .name{animation-delay:.7s}
  .amp{display:block;font-family:var(--display);font-style:italic;
    font-size:clamp(20px,5.2vw,26px);color:var(--saffron-l);
    margin:clamp(4px,1.4vw,8px) 0;animation-delay:.85s}
  .amp2{animation-delay:1s}

  .sub{font-family:var(--display);font-style:italic;font-weight:300;
    font-size:clamp(15px,4.2vw,19px);color:var(--saffron-l);
    margin-top:clamp(14px,3.6vw,20px);animation-delay:1.15s;line-height:1.55;opacity:.92}

  .rule{margin:clamp(26px,6vw,36px) auto;width:0;height:1px;
    background:linear-gradient(90deg,transparent,var(--saffron),transparent)}
  .revealed .rule{animation:grow 1.2s ease 1.3s forwards}
  @keyframes grow{to{width:82%}}

  .detail{margin:clamp(14px,3.6vw,20px) 0;animation-delay:1.4s}
  .detail .label{font-size:clamp(8px,2.3vw,10px);letter-spacing:5px;text-transform:uppercase;color:var(--henna)}
  .detail .value{font-family:var(--display);font-size:clamp(18px,4.8vw,22px);
    color:var(--cream);margin-top:8px;line-height:1.45}

  .countdown{display:flex;justify-content:center;gap:clamp(5px,1.8vw,10px);
    margin:clamp(28px,6.5vw,38px) 0 0;animation-delay:1.6s}
  .cd-box{flex:1;max-width:70px;padding:clamp(11px,2.9vw,14px) 3px;
    background:rgba(212,160,23,.08);border:1px solid rgba(212,160,23,.25)}
  .cd-num{font-family:var(--display);font-size:clamp(21px,5.8vw,28px);color:var(--saffron-l);line-height:1}
  .cd-lab{font-size:clamp(7px,2vw,9px);letter-spacing:2.5px;text-transform:uppercase;
    color:var(--henna);margin-top:8px}

  .footer{margin-top:clamp(24px,5.5vw,32px);font-family:var(--display);font-style:italic;
    font-size:clamp(14px,3.8vw,16px);color:var(--saffron-l);animation-delay:1.8s;
    line-height:1.7;opacity:.88}
  @media (max-height:620px){.plate{width:82px;height:82px;margin-bottom:16px}.card{margin:18px auto 80px}}
  @media (prefers-reduced-motion:reduce){*{animation-duration:.01ms !important;animation-iteration-count:1 !important}}
</style>
</head>
<body>
<div class="scene"><div class="pattern"></div></div>
<div class="sparks" id="sparks"></div>

<div class="gate" id="gate">
  <div class="door left">
    <div class="carve">
      <svg viewBox="0 0 200 500" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
        <path class="buta" d="M100 60 C150 100 150 170 100 210 C50 170 50 100 100 60 Z"/>
        <path class="buta" d="M100 90 C130 115 130 160 100 182 C70 160 70 115 100 90 Z"/>
        <circle class="dot" cx="100" cy="136" r="8"/>
        <path class="buta" d="M100 250 C150 290 150 360 100 400 C50 360 50 290 100 250 Z"/>
        <path class="buta" d="M100 280 C130 305 130 350 100 372 C70 350 70 305 100 280 Z"/>
        <circle class="dot" cx="100" cy="326" r="8"/>
        <path class="buta" d="M40 430 Q100 460 160 430"/>
        <path class="buta" d="M40 30 Q100 0 160 30"/>
      </svg>
    </div>
    <div class="handle"></div>
  </div>
  <div class="door right">
    <div class="carve">
      <svg viewBox="0 0 200 500" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
        <path class="buta" d="M100 60 C150 100 150 170 100 210 C50 170 50 100 100 60 Z"/>
        <path class="buta" d="M100 90 C130 115 130 160 100 182 C70 160 70 115 100 90 Z"/>
        <circle class="dot" cx="100" cy="136" r="8"/>
        <path class="buta" d="M100 250 C150 290 150 360 100 400 C50 360 50 290 100 250 Z"/>
        <path class="buta" d="M100 280 C130 305 130 350 100 372 C70 350 70 305 100 280 Z"/>
        <circle class="dot" cx="100" cy="326" r="8"/>
        <path class="buta" d="M40 430 Q100 460 160 430"/>
        <path class="buta" d="M40 30 Q100 0 160 30"/>
      </svg>
    </div>
    <div class="handle"></div>
  </div>
  <div class="gate-center">
    <div class="plate"><span id="monogram">A&amp;R</span></div>
    <div class="tap-hint">Açmaq üçün toxunun<small>↔</small></div>
  </div>
</div>

<main class="card" id="card">
  <svg class="nar reveal" viewBox="0 0 80 90" xmlns="http://www.w3.org/2000/svg">
    <path d="M40 22 C64 22 72 44 72 58 C72 76 58 86 40 86 C22 86 8 76 8 58 C8 44 16 22 40 22 Z"/>
    <path d="M40 22 L40 8 M40 12 L30 4 M40 12 L50 4"/>
    <circle cx="32" cy="52" r="4"/><circle cx="48" cy="52" r="4"/>
    <circle cx="40" cy="64" r="4"/><circle cx="26" cy="66" r="3.5"/><circle cx="54" cy="66" r="3.5"/>
  </svg>
  <div class="eyebrow reveal" id="topText">Xına gecəmizə dəvətlisiniz</div>
  <h1 class="names">
    <div class="name reveal" id="name1">Aynur</div>
    <span class="amp reveal">&amp;</span>
    <div class="name reveal amp2" id="name2">Rəşad</div>
  </h1>
  <div class="sub reveal" id="subText">şirin gecəmizi bizimlə bölüşün</div>
  <div class="rule"></div>
  <div class="detail reveal"><div class="label">Tarix</div><div class="value" id="dateText">11 Sentyabr 2026 · Cümə · 19:00</div></div>
  <div class="detail reveal"><div class="label">Ünvan</div><div class="value" id="venueText">Gül Palace, Bakı</div></div>
  <div class="countdown" id="countdown"></div>
  <div class="footer reveal" id="footerText">Xınamız qutlu, sevincimiz bol olsun</div>
</main>

<div class="candles" id="candles"></div>

<script>
/* ===== BURANI DƏYİŞ ===== */
const MELUMAT = {
  monoqram:"A&R", ad1:"Aynur", ad2:"Rəşad",
  ustYazi:"Xına gecəmizə dəvətlisiniz",
  altYazi:"şirin gecəmizi bizimlə bölüşün",
  tarixYazi:"11 Sentyabr 2026 · Cümə · 19:00",
  mekan:"Gül Palace, Bakı",
  sonYazi:"Xınamız qutlu, sevincimiz bol olsun",
  tedbirTarixi:"2026-09-11T19:00:00"
};
/* ===== BURANI DƏYİŞ ===== */

const $=id=>document.getElementById(id);
$("monogram").textContent=MELUMAT.monoqram; $("name1").textContent=MELUMAT.ad1;
$("name2").textContent=MELUMAT.ad2; $("topText").textContent=MELUMAT.ustYazi;
$("subText").textContent=MELUMAT.altYazi; $("dateText").textContent=MELUMAT.tarixYazi;
$("venueText").textContent=MELUMAT.mekan; $("footerText").textContent=MELUMAT.sonYazi;
document.title=MELUMAT.ad1+" & "+MELUMAT.ad2+" — Xına Gecəsi";

const small=window.innerWidth<600;

// şamlar
const cw=$("candles"), cn=small?5:9;
for(let i=0;i<cn;i++){
  const c=document.createElement("div");c.className="candle";
  c.style.height=((small?34:46)+Math.random()*(small?16:22))+"px";
  const f=document.createElement("div");f.className="flame";
  f.style.animationDuration=(.55+Math.random()*.5)+"s";
  f.style.animationDelay=(Math.random()*.8)+"s";
  c.appendChild(f);cw.appendChild(c);
}
// qığılcımlar
const sw=$("sparks");
for(let i=0;i<(small?12:22);i++){
  const s=document.createElement("i");
  const z=1.4+Math.random()*2.6;
  s.style.width=z+"px";s.style.height=z+"px";
  s.style.left=Math.random()*100+"vw";s.style.bottom="12vh";
  s.style.animationDuration=(9+Math.random()*10)+"s";
  s.style.animationDelay=(Math.random()*11)+"s";
  sw.appendChild(s);
}

const gate=$("gate"),card=$("card");
document.body.classList.add("locked");
let opened=false;
function openGate(e){if(opened)return;if(e)e.preventDefault();opened=true;
  gate.classList.add("open");card.classList.add("revealed");
  setTimeout(()=>{gate.classList.add("gone");document.body.classList.remove("locked")},2200);}
gate.addEventListener("pointerdown",openGate);
gate.addEventListener("click",openGate);
gate.addEventListener("touchstart",openGate,{passive:false});

const wd=new Date(MELUMAT.tedbirTarixi),lb=["Gün","Saat","Dəq","San"],cd=$("countdown");
function r(){const d=wd-new Date();let v=[0,0,0,0];
  if(d>0)v=[Math.floor(d/864e5),Math.floor(d/36e5)%24,Math.floor(d/6e4)%60,Math.floor(d/1e3)%60];
  cd.innerHTML=v.map((x,i)=>`<div class="cd-box"><div class="cd-num">${String(x).padStart(2,"0")}</div><div class="cd-lab">${lb[i]}</div></div>`).join("");}
r();setInterval(r,1000);
</script>
</body>
</html>
