<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#1a1230">
<title>Toy Dəvətnaməsi</title>

<!-- WhatsApp / sosial şəbəkə önizləməsi -->
<meta property="og:title" content="Toy Dəvətnaməsi">
<meta property="og:description" content="Toy şənliyimizə dəvətlisiniz — açmaq üçün toxunun">
<meta property="og:type" content="website">

<style>
  :root{
    --bg1:#1a1230; --bg2:#2c1a4a;
    --gold:#e8c88a; --gold-bright:#f7e2b0; --gold-deep:#b8934f;
    --rose:#e8a0b8; --cream:#fbf6ee; --ink:#f3ece0;
    --door:#3a2757; --door2:#2b1c43;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overflow-x:hidden}
  body{
    font-family:"Georgia","Times New Roman",serif;
    background:radial-gradient(circle at 50% 20%, var(--bg2), var(--bg1) 70%);
    background-attachment:fixed;
    color:var(--ink);
    min-height:100vh; min-height:100dvh;
    display:flex;align-items:center;justify-content:center;
    position:relative;
    -webkit-text-size-adjust:100%;
  }
  /* qapaq açıq ikən arxa fonun sürüşməsinin qarşısını al */
  body.locked{overflow:hidden;position:fixed;width:100%}

  /* ===== LƏÇƏKLƏR ===== */
  .petals{position:fixed;inset:0;pointer-events:none;z-index:1;overflow:hidden}
  .petal{position:absolute;top:-40px;opacity:0;animation:fall linear infinite;will-change:transform}
  @keyframes fall{
    0%{transform:translate3d(0,-40px,0) rotate(0deg);opacity:0}
    10%{opacity:.85}90%{opacity:.85}
    100%{transform:translate3d(0,105vh,0) rotate(360deg);opacity:0}
  }

  /* ===== QAPI QAPAĞI ===== */
  .gate{
    position:fixed;inset:0;z-index:20;
    display:flex;perspective:1400px;
    cursor:pointer;overflow:hidden;
    touch-action:manipulation;
  }
  .gate.open{pointer-events:none}
  .gate.gone{display:none}
  .door{
    position:relative;width:50.2%;height:100%;
    background:
      linear-gradient(180deg, rgba(255,255,255,.05), rgba(0,0,0,.28)),
      repeating-linear-gradient(90deg, var(--door) 0 clamp(20px,6vw,38px), var(--door2) clamp(20px,6vw,38px) calc(clamp(20px,6vw,38px) + 2px));
    border-top:3px solid var(--gold-deep);
    border-bottom:3px solid var(--gold-deep);
    box-shadow:inset 0 0 70px rgba(0,0,0,.55);
    transition:transform 1.9s cubic-bezier(.6,0,.2,1);
    transform-style:preserve-3d;backface-visibility:hidden;
    will-change:transform;
  }
  .door.left{transform-origin:left center;border-left:3px solid var(--gold-deep)}
  .door.right{transform-origin:right center;border-right:3px solid var(--gold-deep)}
  .gate.open .door.left{transform:rotateY(-102deg)}
  .gate.open .door.right{transform:rotateY(102deg)}

  .door .panel{
    position:absolute;inset:clamp(14px,4vw,26px);
    border:2px solid rgba(232,200,138,.45);border-radius:8px;
    box-shadow:inset 0 0 26px rgba(232,200,138,.08);
  }
  .door .panel::after{content:"";position:absolute;inset:clamp(8px,2.5vw,14px);
    border:1px solid rgba(232,200,138,.25);border-radius:5px}
  .handle{
    position:absolute;top:50%;transform:translateY(-50%);
    width:clamp(10px,2.5vw,16px);height:clamp(36px,9vw,52px);border-radius:8px;
    background:linear-gradient(180deg,var(--gold-bright),var(--gold-deep));
    box-shadow:0 0 12px rgba(232,200,138,.6);
  }
  .door.left .handle{right:clamp(8px,2.5vw,16px)}
  .door.right .handle{left:clamp(8px,2.5vw,16px)}

  .gate-center{
    position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
    z-index:2;text-align:center;pointer-events:none;
    width:90%;transition:opacity .5s ease;
  }
  .gate.open .gate-center{opacity:0}
  .monogram{
    width:clamp(88px,26vw,120px);height:clamp(88px,26vw,120px);
    margin:0 auto clamp(16px,4vw,22px);border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    border:2px solid var(--gold);color:var(--gold-bright);
    font-size:clamp(28px,8vw,42px);letter-spacing:2px;
    background:radial-gradient(circle,rgba(232,200,138,.12),transparent 70%);
    animation:glow 2.6s ease-in-out infinite;
  }
  @keyframes glow{0%,100%{box-shadow:0 0 26px rgba(232,200,138,.25)}50%{box-shadow:0 0 50px rgba(232,200,138,.55)}}
  .tap-hint{font-size:clamp(11px,3.2vw,14px);letter-spacing:3px;text-transform:uppercase;color:var(--gold)}
  .tap-hint small{display:block;margin-top:8px;font-size:clamp(22px,6vw,26px);animation:tapper 1.6s ease-in-out infinite}
  @keyframes tapper{0%,100%{transform:translateY(0);opacity:.7}50%{transform:translateY(-8px);opacity:1}}

  /* ===== DƏVƏTNAMƏ KARTI ===== */
  .card{
    position:relative;z-index:2;
    width:min(92vw,560px);
    margin:clamp(20px,6vw,40px) auto;
    padding:clamp(34px,9vw,56px) clamp(20px,6vw,34px) clamp(30px,8vw,46px);
    text-align:center;
    background:linear-gradient(160deg, rgba(255,255,255,.06), rgba(255,255,255,.02));
    border:1px solid rgba(232,200,138,.35);
    border-radius:20px;
    box-shadow:0 24px 70px rgba(0,0,0,.55), inset 0 0 60px rgba(232,200,138,.05);
    overflow:hidden;
  }
  .card::before{
    content:"";position:absolute;top:0;left:-60%;width:60%;height:100%;
    background:linear-gradient(90deg,transparent,rgba(247,226,176,.13),transparent);
  }
  .revealed.card::before{animation:shine 6s ease-in-out 1s infinite}
  @keyframes shine{0%{left:-60%}45%,100%{left:130%}}

  .reveal{opacity:0;transform:translateY(22px)}
  .revealed .reveal{animation:rise .9s ease forwards}
  @keyframes rise{to{opacity:1;transform:translateY(0)}}

  .top{font-size:clamp(11px,3vw,13px);letter-spacing:4px;text-transform:uppercase;color:var(--gold);animation-delay:.2s}
  .ornament{color:var(--gold);font-size:clamp(22px,6vw,26px);margin:14px 0 6px;animation-delay:.4s}
  .ornament span{display:inline-block;animation:beat 2.4s ease-in-out infinite}
  @keyframes beat{0%,100%{transform:scale(1)}50%{transform:scale(1.18)}}

  .names{font-size:clamp(30px,10vw,54px);line-height:1.15;color:var(--cream);margin:10px 0;font-weight:normal;
    text-shadow:0 2px 20px rgba(232,200,138,.25);overflow-wrap:break-word}
  .name{animation-delay:.6s}
  .amp{display:block;font-size:clamp(22px,6vw,28px);color:var(--rose);margin:4px 0;animation-delay:.75s;font-style:italic}
  .amp2{animation-delay:.9s}

  .sub{font-size:clamp(13px,3.6vw,15px);letter-spacing:1.5px;color:var(--gold);margin-top:14px;animation-delay:1s}

  .divider{width:0;height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent);margin:clamp(20px,5vw,26px) auto}
  .revealed .divider{animation:grow 1.1s ease 1.1s forwards}
  @keyframes grow{to{width:78%}}

  .detail{margin:14px 0;animation-delay:1.25s}
  .detail .label{font-size:clamp(10px,2.8vw,11px);letter-spacing:2.5px;text-transform:uppercase;color:var(--rose);opacity:.85}
  .detail .value{font-size:clamp(16px,4.4vw,19px);color:var(--ink);margin-top:5px;line-height:1.45}

  .countdown{display:flex;justify-content:center;gap:clamp(7px,2.4vw,14px);margin:clamp(22px,6vw,30px) 0 10px;animation-delay:1.5s}
  .cd-box{flex:1;max-width:74px;padding:clamp(9px,2.6vw,12px) 4px;border-radius:11px;
    background:rgba(232,200,138,.08);border:1px solid rgba(232,200,138,.3)}
  .cd-num{font-size:clamp(19px,5.6vw,26px);color:var(--gold-bright);line-height:1}
  .cd-lab{font-size:clamp(8px,2.3vw,10px);letter-spacing:1px;text-transform:uppercase;color:var(--gold);margin-top:6px}

  .footer{margin-top:clamp(20px,5vw,26px);font-size:clamp(12px,3.3vw,13px);color:var(--gold);letter-spacing:.5px;
    animation-delay:1.7s;font-style:italic;line-height:1.6}
  .rings{font-size:clamp(26px,7vw,30px);margin-top:8px;animation-delay:1.8s}
  .rings span{display:inline-block;animation:sway 3s ease-in-out infinite}
  @keyframes sway{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(8deg)}}

  /* çox kiçik ekranlar */
  @media (max-height:600px){
    .monogram{width:72px;height:72px;font-size:24px;margin-bottom:12px}
    .card{margin:16px auto}
  }
</style>
</head>
<body>
  <div class="petals" id="petals"></div>

  <!-- QAPI QAPAĞI -->
  <div class="gate" id="gate">
    <div class="door left"><div class="panel"></div><div class="handle"></div></div>
    <div class="door right"><div class="panel"></div><div class="handle"></div></div>
    <div class="gate-center">
      <div class="monogram" id="monogram">A&amp;R</div>
      <div class="tap-hint" id="tapHint">Açmaq üçün toxunun<small>👆</small></div>
    </div>
  </div>

  <!-- DƏVƏTNAMƏ -->
  <main class="card" id="card">
    <div class="top reveal" id="topText">Dəvətlisiniz</div>
    <div class="ornament reveal"><span>❦</span></div>
    <h1 class="names">
      <div class="name reveal" id="name1">Aynur</div>
      <span class="amp reveal">&amp;</span>
      <div class="name reveal amp2" id="name2">Rəşad</div>
    </h1>
    <div class="sub reveal" id="subText">bir olmağımızın toy şənliyinə</div>
    <div class="divider"></div>
    <div class="detail reveal">
      <div class="label">Tarix</div>
      <div class="value" id="dateText">12 Sentyabr 2026 · Şənbə · saat 18:00</div>
    </div>
    <div class="detail reveal">
      <div class="label">Məkan</div>
      <div class="value" id="venueText">Gül Palace Şadlıq Sarayı, Bakı</div>
    </div>
    <div class="countdown" id="countdown"></div>
    <div class="footer reveal" id="footerText">Bu xüsusi günü bizimlə bölüşməyinizi arzu edirik</div>
    <div class="rings reveal"><span>💍</span></div>
  </main>

<script>
/* ==========================================================
   ↓↓↓  BURANI DƏYİŞ  —  başqa heç bir yerə toxunma  ↓↓↓
   ========================================================== */
const MELUMAT = {
  monoqram:  "A&R",                                  // qapıdakı baş hərflər
  ad1:       "Aynur",                                // gəlin
  ad2:       "Rəşad",                                // bəy
  ustYazi:   "Dəvətlisiniz",
  altYazi:   "bir olmağımızın toy şənliyinə",
  tarixYazi: "12 Sentyabr 2026 · Şənbə · saat 18:00",// ekranda görünən tarix
  mekan:     "Gül Palace Şadlıq Sarayı, Bakı",
  sonYazi:   "Bu xüsusi günü bizimlə bölüşməyinizi arzu edirik",

  // Geri sayım üçün tarix: "İL-AY-GÜNTsaat:dəqiqə:00"
  toyTarixi: "2026-09-12T18:00:00"
};
/* ==========================================================
   ↑↑↑  BURANI DƏYİŞ  ↑↑↑
   ========================================================== */

// Məlumatları səhifəyə yaz
document.getElementById("monogram").textContent  = MELUMAT.monoqram;
document.getElementById("name1").textContent     = MELUMAT.ad1;
document.getElementById("name2").textContent     = MELUMAT.ad2;
document.getElementById("topText").textContent   = MELUMAT.ustYazi;
document.getElementById("subText").textContent   = MELUMAT.altYazi;
document.getElementById("dateText").textContent  = MELUMAT.tarixYazi;
document.getElementById("venueText").textContent = MELUMAT.mekan;
document.getElementById("footerText").textContent= MELUMAT.sonYazi;
document.title = MELUMAT.ad1 + " & " + MELUMAT.ad2 + " — Toy Dəvətnaməsi";

// Ləçəklər (telefonda daha az — sürət üçün)
const petalChars=["🌸","🌷","💗","✿","❀"];
const isSmall = window.innerWidth < 600;
const count = isSmall ? 14 : 26;
const wrap=document.getElementById("petals");
for(let i=0;i<count;i++){
  const p=document.createElement("div");
  p.className="petal";
  p.textContent=petalChars[i%petalChars.length];
  p.style.left=Math.random()*100+"vw";
  p.style.animationDuration=(7+Math.random()*8)+"s";
  p.style.animationDelay=(Math.random()*8)+"s";
  p.style.fontSize=(isSmall?11:14)+Math.random()*(isSmall?10:16)+"px";
  wrap.appendChild(p);
}

// Qapını aç — toxunma və klik üçün
const gate=document.getElementById("gate");
const card=document.getElementById("card");
document.body.classList.add("locked");
let opened=false;
function openGate(e){
  if(opened) return;
  if(e) e.preventDefault();
  opened=true;
  gate.classList.add("open");
  card.classList.add("revealed");
  setTimeout(()=>{
    gate.classList.add("gone");
    document.body.classList.remove("locked");
  },2000);
}
gate.addEventListener("pointerdown",openGate);
gate.addEventListener("click",openGate);
gate.addEventListener("touchstart",openGate,{passive:false});

// Geri sayım
const weddingDate=new Date(MELUMAT.toyTarixi);
const labels=["Gün","Saat","Dəq","San"];
const cd=document.getElementById("countdown");
function render(){
  const diff=weddingDate-new Date();
  let v=[0,0,0,0];
  if(diff>0){
    v=[Math.floor(diff/86400000),Math.floor(diff/3600000)%24,Math.floor(diff/60000)%60,Math.floor(diff/1000)%60];
  }
  cd.innerHTML=v.map((n,i)=>
    `<div class="cd-box"><div class="cd-num">${String(n).padStart(2,"0")}</div><div class="cd-lab">${labels[i]}</div></div>`
  ).join("");
}
render();
setInterval(render,1000);
</script>
</body>
</html>
