<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#e9f0e2">
<title>Toy Dəvətnaməsi — Bağ</title>
<meta property="og:title" content="Toy Dəvətnaməsi">
<meta property="og:description" content="Toy şənliyimizə dəvətlisiniz — açmaq üçün toxunun">
<style>
  :root{
    --grass:#7d9b62; --leaf:#4f6f3c; --leaf2:#6d9451;
    --rose:#d9738f; --rose2:#f3b9c8; --bark:#7a5a3c;
    --cream:#fffdf8; --ink:#3a4433; --white:#fff;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overflow-x:hidden}
  body{
    font-family:"Georgia","Times New Roman",serif;
    background:linear-gradient(180deg,#dcefff 0%,#eaf6e4 34%,#d6e9c4 62%,#b9d69d 100%);
    background-attachment:fixed;
    color:var(--ink);min-height:100vh;min-height:100dvh;
    display:flex;align-items:center;justify-content:center;position:relative;
    -webkit-text-size-adjust:100%;
  }
  body.locked{overflow:hidden;position:fixed;width:100%}
  .scene{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}

  /* günəş işığı */
  .sunbeam{position:absolute;top:-12%;left:50%;transform:translateX(-50%);
    width:min(80vw,520px);height:min(80vw,520px);border-radius:50%;
    background:radial-gradient(circle,rgba(255,250,215,.8),transparent 62%);
    animation:beam 8s ease-in-out infinite}
  @keyframes beam{0%,100%{opacity:.55}50%{opacity:1}}

  /* AĞACLAR — kənarlarda, küləkdə yellənir */
  .tree{position:absolute;bottom:6vh;width:clamp(140px,34vw,300px);
    transform-origin:50% 100%;filter:drop-shadow(0 10px 18px rgba(80,110,60,.2))}
  .tree.t1{left:-7vw;animation:windsway 7s ease-in-out infinite}
  .tree.t2{right:-7vw;animation:windsway 9s ease-in-out infinite reverse}
  .tree.t3{left:16vw;bottom:9vh;width:clamp(90px,20vw,180px);opacity:.65;
    animation:windsway 11s ease-in-out infinite}
  .tree.t4{right:18vw;bottom:10vh;width:clamp(80px,18vw,160px);opacity:.6;
    animation:windsway 13s ease-in-out infinite reverse}
  @keyframes windsway{0%,100%{transform:rotate(-1.4deg)}50%{transform:rotate(1.4deg)}}
  .tree svg{display:block;width:100%;height:auto}
  .crown{transform-origin:50% 90%;animation:crownsway 5.5s ease-in-out infinite}
  @keyframes crownsway{0%,100%{transform:rotate(-2.2deg)}50%{transform:rotate(2.2deg)}}

  /* GÜL ZOLAĞI — aşağıda */
  .bed{position:absolute;bottom:0;left:0;width:100%;height:22vh}
  .bed .ground{position:absolute;bottom:0;width:100%;height:11vh;
    background:radial-gradient(ellipse at 50% 120%,rgba(105,140,80,.75),rgba(140,175,110,.35) 60%,transparent)}
  .flower{position:absolute;bottom:2vh;transform-origin:50% 100%;
    animation:stemsway ease-in-out infinite}
  @keyframes stemsway{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(6deg)}}
  .flower svg{display:block;width:100%;height:auto}
  /* ot tililəri */
  .blade{position:absolute;bottom:0;width:3px;border-radius:2px;background:linear-gradient(180deg,#8fb56a,#5f8043);
    transform-origin:50% 100%;animation:stemsway ease-in-out infinite}

  /* KƏPƏNƏKLƏR */
  .bfly{position:absolute;font-size:clamp(14px,3.6vw,22px);animation:flutter linear infinite;will-change:transform}
  .bfly i{display:inline-block;font-style:normal;animation:wing .5s ease-in-out infinite}
  @keyframes wing{0%,100%{transform:scaleX(1)}50%{transform:scaleX(.45)}}
  @keyframes flutter{
    0%{transform:translate3d(-10vw,0,0);opacity:0}
    8%{opacity:1}
    25%{transform:translate3d(20vw,-14vh,0)}
    50%{transform:translate3d(50vw,4vh,0)}
    75%{transform:translate3d(80vw,-12vh,0)}
    92%{opacity:1}
    100%{transform:translate3d(110vw,0,0);opacity:0}
  }

  /* DÜŞƏN LƏÇƏKLƏR */
  .petals{position:absolute;inset:0;overflow:hidden}
  .petal{position:absolute;top:-30px;opacity:0;animation:fall linear infinite;will-change:transform}
  @keyframes fall{
    0%{transform:translate3d(0,-30px,0) rotate(0);opacity:0}
    12%{opacity:.95}86%{opacity:.95}
    100%{transform:translate3d(60px,108vh,0) rotate(420deg);opacity:0}
  }

  /* ===== QAPI: ağ bağ darvazası + sarmaşıq və güllər ===== */
  .gate{position:fixed;inset:0;z-index:20;display:flex;perspective:1400px;cursor:pointer;overflow:hidden;touch-action:manipulation}
  .gate.open{pointer-events:none}
  .gate.gone{display:none}
  .door{position:relative;width:50.2%;height:100%;
    background:linear-gradient(180deg,#ffffff,#f2f6ec);
    box-shadow:inset 0 0 80px rgba(93,122,72,.16);
    transition:transform 2s cubic-bezier(.6,0,.2,1);
    transform-style:preserve-3d;backface-visibility:hidden;will-change:transform;overflow:hidden}
  .door.left{transform-origin:left center}
  .door.right{transform-origin:right center}
  .gate.open .door.left{transform:rotateY(-104deg)}
  .gate.open .door.right{transform:rotateY(104deg)}
  .lattice{position:absolute;inset:clamp(16px,4.5vw,30px);
    border:clamp(5px,1.5vw,9px) solid var(--white);border-radius:6px;
    box-shadow:0 0 0 2px rgba(93,122,72,.22), inset 0 0 0 2px rgba(93,122,72,.16);
    background-image:
      repeating-linear-gradient(45deg, rgba(93,122,72,.18) 0 2px, transparent 2px clamp(24px,6.5vw,36px)),
      repeating-linear-gradient(-45deg, rgba(93,122,72,.18) 0 2px, transparent 2px clamp(24px,6.5vw,36px))}
  .ivy{position:absolute;inset:0;overflow:hidden}
  .ivy i{position:absolute;font-style:normal;animation:leafsway 4.5s ease-in-out infinite;
    filter:drop-shadow(0 2px 3px rgba(80,110,60,.25))}
  @keyframes leafsway{0%,100%{transform:rotate(-10deg)}50%{transform:rotate(10deg)}}
  .handle{position:absolute;top:50%;transform:translateY(-50%);
    width:clamp(12px,2.8vw,17px);height:clamp(38px,9vw,52px);border-radius:9px;
    background:linear-gradient(180deg,#cfd9c2,var(--leaf));box-shadow:0 2px 8px rgba(61,70,54,.28)}
  .door.left .handle{right:clamp(9px,2.6vw,16px)}
  .door.right .handle{left:clamp(9px,2.6vw,16px)}

  .gate-center{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
    z-index:2;text-align:center;pointer-events:none;width:90%;transition:opacity .5s ease}
  .gate.open .gate-center{opacity:0}
  .monogram{width:clamp(88px,26vw,120px);height:clamp(88px,26vw,120px);margin:0 auto clamp(16px,4vw,22px);
    border-radius:50%;display:flex;align-items:center;justify-content:center;
    border:3px solid var(--leaf);color:var(--leaf);font-size:clamp(28px,8vw,42px);letter-spacing:2px;
    background:rgba(255,255,255,.92);box-shadow:0 6px 24px rgba(93,122,72,.3);
    animation:bloom 3.4s ease-in-out infinite}
  @keyframes bloom{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
  .tap-hint{font-size:clamp(11px,3.2vw,14px);letter-spacing:3px;text-transform:uppercase;color:var(--leaf);font-weight:bold}
  .tap-hint small{display:block;margin-top:8px;font-size:clamp(22px,6vw,26px);animation:tapper 1.6s ease-in-out infinite}
  @keyframes tapper{0%,100%{transform:translateY(0);opacity:.6}50%{transform:translateY(-8px);opacity:1}}

  /* ===== KART ===== */
  .card{position:relative;z-index:5;width:min(92vw,560px);
    margin:clamp(20px,6vw,40px) auto;
    padding:clamp(34px,9vw,56px) clamp(20px,6vw,34px) clamp(30px,8vw,46px);
    text-align:center;
    background:rgba(255,253,248,.9);
    border:1px solid rgba(93,122,72,.28);border-radius:20px;
    box-shadow:0 20px 55px rgba(93,122,72,.25), inset 0 0 50px rgba(243,185,200,.12);
    backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);overflow:hidden}
  .card::before{content:"";position:absolute;top:0;left:-60%;width:60%;height:100%;
    background:linear-gradient(90deg,transparent,rgba(255,255,255,.6),transparent)}
  .revealed.card::before{animation:shine 6s ease-in-out 1s infinite}
  @keyframes shine{0%{left:-60%}45%,100%{left:130%}}
  .reveal{opacity:0;transform:translateY(22px)}
  .revealed .reveal{animation:up .9s ease forwards}
  @keyframes up{to{opacity:1;transform:translateY(0)}}
  .top{font-size:clamp(11px,3vw,13px);letter-spacing:4px;text-transform:uppercase;color:var(--leaf);animation-delay:.2s}
  .ornament{font-size:clamp(24px,6.5vw,30px);margin:14px 0 6px;animation-delay:.4s}
  .ornament span{display:inline-block;animation:sway 3.4s ease-in-out infinite}
  .names{font-size:clamp(30px,10vw,54px);line-height:1.15;color:#44513a;margin:10px 0;font-weight:normal;overflow-wrap:break-word}
  .name{animation-delay:.6s}
  .amp{display:block;font-size:clamp(22px,6vw,28px);color:var(--rose);margin:4px 0;animation-delay:.75s;font-style:italic}
  .amp2{animation-delay:.9s}
  .sub{font-size:clamp(13px,3.6vw,15px);letter-spacing:1.5px;color:var(--grass);margin-top:14px;animation-delay:1s}
  .divider{width:0;height:1px;background:linear-gradient(90deg,transparent,var(--grass),transparent);margin:clamp(20px,5vw,26px) auto}
  .revealed .divider{animation:grow 1.1s ease 1.1s forwards}
  @keyframes grow{to{width:78%}}
  .detail{margin:14px 0;animation-delay:1.25s}
  .detail .label{font-size:clamp(10px,2.8vw,11px);letter-spacing:2.5px;text-transform:uppercase;color:var(--rose)}
  .detail .value{font-size:clamp(16px,4.4vw,19px);color:var(--ink);margin-top:5px;line-height:1.45}
  .countdown{display:flex;justify-content:center;gap:clamp(7px,2.4vw,14px);margin:clamp(22px,6vw,30px) 0 10px;animation-delay:1.5s}
  .cd-box{flex:1;max-width:74px;padding:clamp(9px,2.6vw,12px) 4px;border-radius:11px;
    background:rgba(125,155,98,.12);border:1px solid rgba(93,122,72,.3)}
  .cd-num{font-size:clamp(19px,5.6vw,26px);color:var(--leaf);line-height:1}
  .cd-lab{font-size:clamp(8px,2.3vw,10px);letter-spacing:1px;text-transform:uppercase;color:var(--grass);margin-top:6px}
  .footer{margin-top:clamp(20px,5vw,26px);font-size:clamp(12px,3.3vw,13px);color:var(--grass);
    animation-delay:1.7s;font-style:italic;line-height:1.6}
  .rings{font-size:clamp(26px,7vw,30px);margin-top:8px;animation-delay:1.8s}
  .rings span{display:inline-block;animation:sway 3s ease-in-out infinite}
  @keyframes sway{0%,100%{transform:rotate(-9deg)}50%{transform:rotate(9deg)}}
  @media (max-height:600px){.monogram{width:72px;height:72px;font-size:24px;margin-bottom:12px}.card{margin:16px auto}}
</style>
</head>
<body>
<div class="scene">
  <div class="sunbeam"></div>

  <!-- AĞACLAR -->
  <div class="tree t3">
    <svg viewBox="0 0 200 260" xmlns="http://www.w3.org/2000/svg">
      <path d="M96 260 L96 150 Q96 120 84 100 M100 170 Q116 148 132 138" stroke="#7a5a3c" stroke-width="7" fill="none" stroke-linecap="round"/>
      <g class="crown">
        <circle cx="98" cy="86" r="52" fill="#7fa85e" opacity=".95"/>
        <circle cx="60" cy="106" r="36" fill="#6d9451"/>
        <circle cx="136" cy="108" r="34" fill="#8cb469"/>
        <circle cx="100" cy="56" r="34" fill="#9cc177"/>
      </g>
    </svg>
  </div>
  <div class="tree t4">
    <svg viewBox="0 0 200 260" xmlns="http://www.w3.org/2000/svg">
      <path d="M104 260 L104 150 Q104 122 118 102 M100 172 Q82 150 66 140" stroke="#7a5a3c" stroke-width="7" fill="none" stroke-linecap="round"/>
      <g class="crown">
        <circle cx="102" cy="88" r="50" fill="#84ae63"/>

      </g>
    </svg>
  </div>
  <div class="tree t1">
    <svg viewBox="0 0 260 320" xmlns="http://www.w3.org/2000/svg">
      <path d="M118 320 L118 190 Q118 150 100 122 M124 214 Q152 186 178 172 M116 250 Q88 226 62 214"
            stroke="#7a5a3c" stroke-width="11" fill="none" stroke-linecap="round"/>
      <g class="crown">

        <circle cx="88" cy="112" r="9" fill="#f3b9c8"/>
        <circle cx="152" cy="92" r="8" fill="#f3b9c8"/>

    <svg viewBox="0 0 260 320" xmlns="http://www.w3.org/2000/svg">
      <path d="M142 320 L142 190 Q142 150 160 122 M136 214 Q108 186 82 172 M144 250 Q172 226 198 214"
            stroke="#7a5a3c" stroke-width="11" fill="none" stroke-linecap="round"/>
      <g class="crown">
        <circle cx="140" cy="104" r="66" fill="#84ae63"/>
        <circle cx="194" cy="132" r="46" fill="#6d9451"/>
        <circle cx="84" cy="130" r="44" fill="#94ba70"/>
        <circle cx="138" cy="58" r="44" fill="#a6c882"/>
        <circle cx="176" cy="72" r="30" fill="#b2d28d"/>
        <circle cx="172" cy="112" r="9" fill="#f3b9c8"/>
        <circle cx="106" cy="94" r="8" fill="#f3b9c8"/>
        <circle cx="140" cy="152" r="8" fill="#f3b9c8"/>
        <circle cx="200" cy="150" r="7" fill="#fbd0da"/>
      </g>
    </svg>
  </div>

  <!-- GÜL ZOLAĞI -->
  <div class="bed" id="bed"><div class="ground"></div></div>

  <div id="bflies"></div>
  <div class="petals" id="petals"></div>
</div>

<div class="gate" id="gate">
  <div class="door left"><div class="lattice"></div><div class="ivy" id="ivyL"></div><div class="handle"></div></div>
  <div class="door right"><div class="lattice"></div><div class="ivy" id="ivyR"></div><div class="handle"></div></div>
  <div class="gate-center">
    <div class="monogram" id="monogram">A&amp;R</div>
    <div class="tap-hint">Açmaq üçün toxunun<small>👆</small></div>
  </div>
</div>

<main class="card" id="card">
  <div class="top reveal" id="topText">Dəvətlisiniz</div>
  <div class="ornament reveal"><span>🌿</span></div>
  <h1 class="names">
    <div class="name reveal" id="name1">Aynur</div>
    <span class="amp reveal">&amp;</span>
    <div class="name reveal amp2" id="name2">Rəşad</div>
  </h1>
  <div class="sub reveal" id="subText">bir olmağımızın toy şənliyinə</div>
  <div class="divider"></div>
  <div class="detail reveal"><div class="label">Tarix</div><div class="value" id="dateText">12 Sentyabr 2026 · Şənbə · saat 18:00</div></div>
  <div class="detail reveal"><div class="label">Məkan</div><div class="value" id="venueText">Gül Palace Şadlıq Sarayı, Bakı</div></div>
  <div class="countdown" id="countdown"></div>
  <div class="footer reveal" id="footerText">Bu xüsusi günü bizimlə bölüşməyinizi arzu edirik</div>
  <div class="rings reveal"><span>💍</span></div>
</main>

<script>
/* ===== BURANI DƏYİŞ ===== */
const MELUMAT = {
  monoqram:"A&R", ad1:"Aynur", ad2:"Rəşad",
  ustYazi:"Dəvətlisiniz",
  altYazi:"bir olmağımızın toy şənliyinə",
  tarixYazi:"12 Sentyabr 2026 · Şənbə · saat 18:00",
  mekan:"Gül Palace Şadlıq Sarayı, Bakı",
  sonYazi:"Bu xüsusi günü bizimlə bölüşməyinizi arzu edirik",
  toyTarixi:"2026-09-12T18:00:00"
};
/* ===== BURANI DƏYİŞ ===== */

const $=id=>document.getElementById(id);
$("monogram").textContent=MELUMAT.monoqram; $("name1").textContent=MELUMAT.ad1;
$("name2").textContent=MELUMAT.ad2; $("topText").textContent=MELUMAT.ustYazi;
$("subText").textContent=MELUMAT.altYazi; $("dateText").textContent=MELUMAT.tarixYazi;
$("venueText").textContent=MELUMAT.mekan; $("footerText").textContent=MELUMAT.sonYazi;
document.title=MELUMAT.ad1+" & "+MELUMAT.ad2+" — Toy Dəvətnaməsi";

const small=window.innerWidth<600;
const bed=$("bed");

// gül SVG-si
const petalColors=["#e8899f","#f3b9c8","#f6d489","#e6a3d0","#ffffff","#f28d7a"];
function flowerSVG(c){
  return `<svg viewBox="0 0 60 120" xmlns="http://www.w3.org/2000/svg">
    <path d="M30 120 L30 46" stroke="#5f8043" stroke-width="4" stroke-linecap="round"/>
    <path d="M30 88 Q12 78 8 62 Q26 62 30 80 Z" fill="#6d9451"/>
    <path d="M30 100 Q48 92 52 76 Q34 76 30 94 Z" fill="#7fa85e"/>
    <g>
      <ellipse cx="30" cy="26" rx="9" ry="15" fill="${c}"/>
      <ellipse cx="30" cy="26" rx="9" ry="15" fill="${c}" transform="rotate(60 30 34)"/>
      <ellipse cx="30" cy="26" rx="9" ry="15" fill="${c}" transform="rotate(120 30 34)"/>
      <ellipse cx="30" cy="42" rx="9" ry="15" fill="${c}" opacity=".9"/>
      <ellipse cx="30" cy="26" rx="9" ry="15" fill="${c}" transform="rotate(-60 30 34)"/>
      <circle cx="30" cy="34" r="6" fill="#f6d489"/>
    </g>
  </svg>`;
}
// güllər
const fn = small?11:20;
for(let i=0;i<fn;i++){
  const f=document.createElement("div");f.className="flower";
  f.style.left=(i*(100/fn)+Math.random()*4)+"%";
  f.style.width=((small?26:34)+Math.random()*(small?14:22))+"px";
  f.style.bottom=(1+Math.random()*5)+"vh";
  f.style.animationDuration=(3.4+Math.random()*2.6)+"s";
  f.style.animationDelay=(Math.random()*3)+"s";
  f.innerHTML=flowerSVG(petalColors[i%petalColors.length]);
  bed.appendChild(f);
}
// ot tilələri
for(let i=0;i<(small?26:46);i++){
  const b=document.createElement("div");b.className="blade";
  b.style.left=Math.random()*100+"%";
  b.style.height=((small?18:24)+Math.random()*(small?22:34))+"px";
  b.style.animationDuration=(2.8+Math.random()*2.4)+"s";
  b.style.animationDelay=(Math.random()*3)+"s";
  bed.appendChild(b);
}
// kəpənəklər
const bw=$("bflies");
for(let i=0;i<(small?3:5);i++){
  const b=document.createElement("div");b.className="bfly";
  b.innerHTML="<i>🦋</i>";
  b.style.top=(30+Math.random()*45)+"vh";
  b.style.animationDuration=(22+Math.random()*16)+"s";
  b.style.animationDelay=(Math.random()*18)+"s";
  bw.appendChild(b);
}
// düşən ləçəklər
const chars=["🌸","🌺","🍃","🌷","❀"], pw=$("petals");
for(let i=0;i<(small?12:22);i++){
  const p=document.createElement("div");p.className="petal";
  p.textContent=chars[i%chars.length];
  p.style.left=Math.random()*100+"vw";
  p.style.animationDuration=(9+Math.random()*9)+"s";
  p.style.animationDelay=(Math.random()*10)+"s";
  p.style.fontSize=((small?11:14)+Math.random()*(small?10:14))+"px";
  pw.appendChild(p);
}
// qapıdakı sarmaşıq və güllər
["ivyL","ivyR"].forEach((id,side)=>{
  const c=$(id);
  for(let i=0;i<(small?14:24);i++){
    const l=document.createElement("i");
    l.textContent=i%5===0?["🌸","🌼"][i%2]:["🌿","🍃","🌱"][i%3];
    const edge=Math.random()<.65;
    l.style.left=edge?(side===0?Math.random()*20:80+Math.random()*20)+"%":Math.random()*100+"%";
    l.style.top=Math.random()*100+"%";
    l.style.fontSize=(13+Math.random()*17)+"px";
    l.style.animationDelay=(Math.random()*4)+"s";
    c.appendChild(l);
  }
});

const gate=$("gate"),card=$("card");
document.body.classList.add("locked");
let opened=false;
function openGate(e){if(opened)return;if(e)e.preventDefault();opened=true;
  gate.classList.add("open");card.classList.add("revealed");
  setTimeout(()=>{gate.classList.add("gone");document.body.classList.remove("locked")},2100);}
gate.addEventListener("pointerdown",openGate);
gate.addEventListener("click",openGate);
gate.addEventListener("touchstart",openGate,{passive:false});

const wd=new Date(MELUMAT.toyTarixi),lb=["Gün","Saat","Dəq","San"],cd=$("countdown");
function r(){const d=wd-new Date();let v=[0,0,0,0];
  if(d>0)v=[Math.floor(d/864e5),Math.floor(d/36e5)%24,Math.floor(d/6e4)%60,Math.floor(d/1e3)%60];
  cd.innerHTML=v.map((x,i)=>`<div class="cd-box"><div class="cd-num">${String(x).padStart(2,"0")}</div><div class="cd-lab">${lb[i]}</div></div>`).join("");}
r();setInterval(r,1000);
</script>
